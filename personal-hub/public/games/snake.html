<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('ph.theme');if(t){if(t==='auto'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_theme.css">
    <link rel="stylesheet" href="_game-ui.css">
    <link rel="manifest" href="../manifest.json">
    <style>
        .game-header h1 {
            font-size: 1.7rem;
            margin: 0 0 2px;
        }

        .game-header .subtitle {
            font-size: 0.8rem;
            margin-bottom: 14px;
        }

        /* ===== BARRA SUPERIOR ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }

        .stat {
            background: var(--surface-2);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 6px 12px;
            text-align: left;
            min-width: 72px;
        }

        .stat-label {
            display: block;
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--ash);
            white-space: nowrap;
        }

        .stat-value {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--ink);
        }

        .stat-value.gold { color: var(--gold); }
        .stat-value.green { color: var(--green); }
        .stat-value.red { color: var(--red); }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== VELOCIDAD ===== */
        .size-control {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px;
            margin-bottom: 14px;
            background: var(--surface-2);
            border: 1px solid var(--panel-border);
            border-radius: 999px;
        }

        .size-btn {
            border: none;
            background: transparent;
            color: var(--ink-dim);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-body);
        }

        .size-btn:hover { color: var(--ink); }
        .size-btn.active {
            background: var(--accent-dim);
            color: var(--coral);
            box-shadow: var(--elev-1);
        }

        .canvas-wrap {
            position: relative;
            max-width: 480px;
            margin: 0 auto;
        }

        canvas {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1/1;
            border-radius: 18px;
            touch-action: none;
            display: block;
        }

        .controls-hint { margin: 10px 0 4px; }

        .actions { margin-top: 14px; }

        .game-back-nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
        .game-back-nav .back-btn { margin-top: 0; }

        .combo-display {
            position: fixed;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: 700;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            font-family: var(--font-display);
            white-space: nowrap;
        }
        .combo-display.show {
            opacity: 1;
            transform: translate(-50%, -60%) scale(1.08);
        }

        @media (max-width: 480px) {
            .stat { padding: 4px 8px; min-width: 56px; }
            .stat-value { font-size: 0.9rem; }
            .game-header h1 { font-size: 1.2rem; }
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="game-header">
            <span class="game-header__emoji" aria-hidden="true">🐍</span>
            <h1>Snake</h1>
            <p class="subtitle">Come la comida · No choques</p>
        </div>

        <!-- ===== BARRA SUPERIOR ===== -->
        <div class="top-bar">
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">🍎 Puntuación</span>
                    <span class="stat-value gold" id="scoreDisplay">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">🏆 Récord</span>
                    <span class="stat-value green" id="highScoreDisplay">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">🐍 Longitud</span>
                    <span class="stat-value" id="lengthDisplay">3</span>
                </div>
                <div class="stat">
                    <span class="stat-label">🔥 Racha</span>
                    <span class="stat-value red" id="comboDisplay">0</span>
                </div>
            </div>
            <div class="top-actions">
                <button class="icon-btn" id="soundBtn" title="Sonido (M)" aria-label="Activar o silenciar sonido">🔊</button>
                <button class="icon-btn" id="pauseBtn" title="Pausa (Espacio)" aria-label="Pausar o reanudar">⏸️</button>
            </div>
        </div>

        <!-- ===== VELOCIDAD ===== -->
        <div class="size-control">
            <button class="size-btn" data-speed="slow">Lento</button>
            <button class="size-btn active" data-speed="normal">Normal</button>
            <button class="size-btn" data-speed="fast">Rápido</button>
        </div>

        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="480" height="480"></canvas>
        </div>

        <div class="controls-hint">⬆ ⬇ ⬅ ➡ · WASD · Espacio pausa · R reiniciar · M sonido · Toca y arrastra</div>

        <div class="actions">
            <button class="btn-primary" id="startBtn">▶ Jugar</button>
        </div>

        <div class="game-back-nav">
            <a href="/#/juegos" class="back-btn">← Juegos</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="combo-display" id="comboPopup"></div>

    <div class="game-message" id="gameMessage">
        <div class="game-message-content">
            <div class="icon" id="msgIcon">💀</div>
            <h2 id="msgTitle">¡Game Over!</h2>
            <p id="msgText">Puntuación: 0 · Longitud: 3 · Récord: 0</p>
            <button class="btn-primary" id="msgBtn">Reintentar</button>
        </div>
    </div>

    <script>
        (() => {
            'use strict';

            // ==============================================================
            // SNAKE — integrado con el sistema de diseño del Personal Hub
            // ==============================================================

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.width,
                H = canvas.height;
            const GRID = 20;
            const COLS = W / GRID,
                ROWS = H / GRID;

            // --- Estado ---
            let snake = [];
            let direction = 'right';
            let nextDirection = 'right';
            let food = null;
            let specialFood = null;
            let score = 0;
            let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
            let bestLength = parseInt(localStorage.getItem('snakeBestLength') || '0', 10);
            let isPlaying = false;
            let paused = false;
            let speed = 180;
            let particles = [];
            let comboCount = 0;
            let comboTimeout = null;
            let lastUpdateTime = 0;
            let recordBroken = false;

            // --- Velocidad (selector Lento/Normal/Rápido) ---
            const SPEEDS = { slow: 260, normal: 180, fast: 115 };
            let speedPref = ['slow', 'normal', 'fast'].includes(localStorage.getItem('snakeSpeed')) ? localStorage.getItem('snakeSpeed') : 'normal';

            // --- Movimiento fluido ---
            let prevPositions = [];
            let lerpFactor = 0;

            // --- DOM ---
            const scoreDisplay = document.getElementById('scoreDisplay');
            const highScoreDisplay = document.getElementById('highScoreDisplay');
            const lengthDisplay = document.getElementById('lengthDisplay');
            const comboDisplay = document.getElementById('comboDisplay');
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const soundBtn = document.getElementById('soundBtn');
            const comboPopup = document.getElementById('comboPopup');

            highScoreDisplay.textContent = highScore;

            // ==============================================================
            // COLORES DEL TEMA (resueltos del CSS para que la serpiente
            // siga el acento del juego y el tema claro/oscuro)
            // ==============================================================
            let THEME = { bg: '#0a0a0c', coral: '#e8735a', red: '#f87171', gold: '#ffd166', ink: '#ffffff', ash: 'rgba(255,255,255,0.38)', grid: 'rgba(255,255,255,0.03)' };

            function syncTheme() {
                const cs = getComputedStyle(document.documentElement);
                const v = (name, fallback) => (cs.getPropertyValue(name) || fallback).trim();
                THEME = {
                    bg: v('--bg-deep', THEME.bg),
                    coral: v('--coral', THEME.coral),
                    red: v('--red', THEME.red),
                    gold: v('--gold', THEME.gold),
                    ink: v('--ink', '#ffffff'),
                    ash: v('--ash', 'rgba(255,255,255,0.38)'),
                    grid: v('--panel-border', 'rgba(255,255,255,0.03)')
                };
                // Aclarar/oscurecer el acento para el degradado del cuerpo
                const body = score > 0 && snake.length > 0 ? 1 : 1;
                THEME.bodyEnd = `color-mix(in srgb, ${THEME.coral} 55%, ${THEME.bg})`;
            }

            // ==============================================================
            // SONIDO (WebAudio, sin archivos)
            // ==============================================================
            let soundOn = localStorage.getItem('snakeSound') !== 'off';
            let audioCtx = null;

            function ensureAudio() {
                if (!audioCtx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) audioCtx = new AC();
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }

            function tone(freq, dur = 0.12, type = 'sine', gain = 0.08, delay = 0) {
                if (!soundOn || !audioCtx) return;
                const t = audioCtx.currentTime + delay;
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(gain, t + 0.015);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                osc.connect(g);
                g.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + dur + 0.02);
            }

            function sfxEat() { tone(440, 0.09, 'triangle', 0.07); tone(660, 0.12, 'triangle', 0.06, 0.06); }
            function sfxSpecial() { tone(523, 0.1, 'sine', 0.07); tone(784, 0.1, 'sine', 0.07, 0.08); tone(1046, 0.16, 'sine', 0.07, 0.16); }
            function sfxSpeed() { tone(520, 0.1, 'square', 0.04); tone(780, 0.14, 'square', 0.04, 0.08); }
            function sfxRecord() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, 'triangle', 0.08, i * 0.12)); }
            function sfxGameOver() { tone(300, 0.2, 'sawtooth', 0.05); tone(220, 0.22, 'sawtooth', 0.05, 0.16); tone(160, 0.4, 'sawtooth', 0.05, 0.32); }
            function sfxPause() { tone(320, 0.08, 'sine', 0.04); }

            function vibrate(pattern) {
                if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) { } }
            }

            function updateSoundBtn() {
                soundBtn.textContent = soundOn ? '🔊' : '🔇';
                soundBtn.classList.toggle('muted', !soundOn);
            }

            function toggleSound() {
                ensureAudio();
                soundOn = !soundOn;
                localStorage.setItem('snakeSound', soundOn ? 'on' : 'off');
                updateSoundBtn();
                if (soundOn) tone(660, 0.1, 'triangle', 0.06);
            }

            // ==============================================================
            // INICIALIZACIÓN
            // ==============================================================
            function initGame() {
                const startX = 12,
                    startY = 12;
                snake = [
                    { x: startX, y: startY },
                    { x: startX - 1, y: startY },
                    { x: startX - 2, y: startY }
                ];
                direction = 'right';
                nextDirection = 'right';
                score = 0;
                speed = SPEEDS[speedPref];
                comboCount = 0;
                particles = [];
                specialFood = null;
                prevPositions = [];
                lerpFactor = 0;
                recordBroken = false;
                comboPopup.classList.remove('show');
                spawnFood();
                isPlaying = false;
                paused = false;
                pauseBtn.textContent = '⏸️';
                updateStartBtn();
                updateUI();
                syncTheme();
            }

            // --- Comida ---
            function spawnFood() {
                let pos;
                let attempts = 0;
                do {
                    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
                    attempts++;
                } while (
                    (snake.some(s => s.x === pos.x && s.y === pos.y) ||
                        (specialFood && pos.x === specialFood.x && pos.y === specialFood.y)) &&
                    attempts < 200
                );
                food = pos;

                if (score > 0 && score % 5 === 0 && Math.random() < 0.3 && !specialFood) {
                    let spPos;
                    let spAttempts = 0;
                    do {
                        spPos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
                        spAttempts++;
                    } while (
                        (snake.some(s => s.x === spPos.x && s.y === spPos.y) ||
                            (spPos.x === food.x && spPos.y === food.y)) &&
                        spAttempts < 100
                    );
                    if (spAttempts < 100) {
                        specialFood = spPos;
                        showToast('🌟 ¡Comida especial! +3 puntos');
                    }
                }
            }

            // --- UI ---
            function updateUI() {
                scoreDisplay.textContent = score;
                highScoreDisplay.textContent = highScore;
                lengthDisplay.textContent = snake.length;
                comboDisplay.textContent = comboCount;
            }

            function showToast(text) {
                const el = document.getElementById('toast');
                el.textContent = text;
                el.classList.add('show');
                clearTimeout(window._toastTimeout);
                window._toastTimeout = setTimeout(() => el.classList.remove('show'), 1400);
            }

            function showCombo(count) {
                if (count < 2) return;
                comboPopup.textContent = `🔥 ${count}x COMBO`;
                comboPopup.classList.add('show');
                clearTimeout(comboTimeout);
                comboTimeout = setTimeout(() => comboPopup.classList.remove('show'), 700);
            }

            // --- Partículas ---
            function spawnParticles(x, y, color, count = 10) {
                const cx = x * GRID + GRID / 2;
                const cy = y * GRID + GRID / 2;
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = 0.5 + Math.random() * 2.5;
                    particles.push({
                        x: cx,
                        y: cy,
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd,
                        life: 1,
                        decay: 0.015 + Math.random() * 0.025,
                        size: 2 + Math.random() * 4,
                        color
                    });
                }
            }

            // ==============================================================
            // DIBUJO
            // ==============================================================
            function draw(alpha) {
                ctx.clearRect(0, 0, W, H);

                // Fondo + rejilla
                ctx.fillStyle = THEME.bg;
                ctx.fillRect(0, 0, W, H);

                ctx.strokeStyle = THEME.grid;
                ctx.lineWidth = 0.5;
                for (let i = 0; i <= COLS; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * GRID, 0);
                    ctx.lineTo(i * GRID, H);
                    ctx.stroke();
                }
                for (let i = 0; i <= ROWS; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, i * GRID);
                    ctx.lineTo(W, i * GRID);
                    ctx.stroke();
                }

                // Partículas
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05;
                    p.life -= p.decay;
                    if (p.life <= 0) { particles.splice(i, 1); continue; }
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * Math.max(0, p.life), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;

                // Comida especial
                if (specialFood) {
                    const pulse = 1 + Math.sin(Date.now() / 300) * 0.08;
                    const cx = specialFood.x * GRID + GRID / 2;
                    const cy = specialFood.y * GRID + GRID / 2;
                    const r = GRID / 2 - 2;

                    ctx.shadowColor = THEME.gold;
                    ctx.shadowBlur = 20;
                    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.5);
                    glow.addColorStop(0, 'color-mix(in srgb, ' + THEME.gold + ' 20%, transparent)');
                    glow.addColorStop(1, 'transparent');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r * 1.5 * pulse, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = THEME.gold;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.font = '600 ' + GRID * 0.55 + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('★', cx, cy + 1);
                }

                // Comida normal
                if (food) {
                    const cx = food.x * GRID + GRID / 2;
                    const cy = food.y * GRID + GRID / 2;
                    const r = GRID / 2 - 3;

                    ctx.shadowColor = 'color-mix(in srgb, ' + THEME.red + ' 45%, transparent)';
                    ctx.shadowBlur = 15;
                    const grad = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.2, 0, cx, cy, r);
                    grad.addColorStop(0, 'color-mix(in srgb, ' + THEME.red + ' 75%, #ffffff)');
                    grad.addColorStop(1, THEME.red);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.beginPath();
                    ctx.arc(cx - r * 0.25, cy - r * 0.25, r * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Serpiente con interpolación
                const positions = [];
                for (let i = 0; i < snake.length; i++) {
                    const seg = snake[i];
                    const prev = prevPositions[i] || seg;
                    positions.push({ x: prev.x + (seg.x - prev.x) * alpha, y: prev.y + (seg.y - prev.y) * alpha });
                }

                for (let i = 0; i < positions.length; i++) {
                    const isHead = i === 0;
                    const progress = i / positions.length;
                    const pos = positions[i];
                    const x = pos.x * GRID + 1;
                    const y = pos.y * GRID + 1;
                    const size = GRID - 2;

                    // Degradado: cabeza en el acento, cuerpo hacia el color base
                    let color;
                    if (isHead) {
                        color = THEME.coral;
                    } else {
                        color = `color-mix(in srgb, ${THEME.coral} ${60 + (1 - progress) * 30}%, ${THEME.bodyEnd})`;
                    }

                    if (isHead) {
                        ctx.shadowColor = 'color-mix(in srgb, ' + THEME.coral + ' 40%, transparent)';
                        ctx.shadowBlur = 15;
                    } else {
                        ctx.shadowColor = 'color-mix(in srgb, ' + THEME.coral + ' 10%, transparent)';
                        ctx.shadowBlur = 6;
                    }

                    const radius = isHead ? 6 : 4;
                    ctx.beginPath();
                    ctx.moveTo(x + radius, y);
                    ctx.lineTo(x + size - radius, y);
                    ctx.quadraticCurveTo(x + size, y, x + size, y + radius);
                    ctx.lineTo(x + size, y + size - radius);
                    ctx.quadraticCurveTo(x + size, y + size, x + size - radius, y + size);
                    ctx.lineTo(x + radius, y + size);
                    ctx.quadraticCurveTo(x, y + size, x, y + size - radius);
                    ctx.lineTo(x, y + radius);
                    ctx.quadraticCurveTo(x, y, x + radius, y);
                    ctx.closePath();

                    ctx.fillStyle = color;
                    ctx.fill();

                    if (isHead) {
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = 'rgba(255,255,255,0.15)';
                        ctx.beginPath();
                        ctx.arc(x + size * 0.3, y + size * 0.3, size * 0.15, 0, Math.PI * 2);
                        ctx.fill();

                        const dirs = {
                            right: [{ dx: size * 0.7, dy: size * 0.2 }, { dx: size * 0.7, dy: size * 0.6 }],
                            left: [{ dx: size * 0.15, dy: size * 0.2 }, { dx: size * 0.15, dy: size * 0.6 }],
                            up: [{ dx: size * 0.2, dy: size * 0.15 }, { dx: size * 0.6, dy: size * 0.15 }],
                            down: [{ dx: size * 0.2, dy: size * 0.7 }, { dx: size * 0.6, dy: size * 0.7 }]
                        };
                        const eyeOffsets = dirs[direction] || dirs.right;
                        const sx = direction === 'right' ? 2 : direction === 'left' ? -2 : 0;
                        const sy = direction === 'down' ? 2 : direction === 'up' ? -2 : 0;
                        for (const off of eyeOffsets) {
                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.arc(x + off.dx, y + off.dy, size * 0.12, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = 'rgba(0,0,0,0.85)';
                            ctx.beginPath();
                            ctx.arc(x + off.dx + sx, y + off.dy + sy, size * 0.06, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    ctx.shadowBlur = 0;
                }

                // Etiqueta inferior
                ctx.fillStyle = THEME.ash;
                ctx.font = '10px Inter, sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`Longitud: ${snake.length}`, 8, H - 6);

                // Pausa
                if (paused && isPlaying) {
                    ctx.fillStyle = 'rgba(0,0,0,0.55)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = THEME.ink;
                    ctx.font = '600 20px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⏸️ Pausa', W / 2, H / 2);
                }

                // Esperando empezar
                if (!isPlaying && !paused) {
                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.font = '600 16px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('▶ Presiona "Jugar"', W / 2, H / 2);
                }
            }

            // ==============================================================
            // ANIMACIÓN FLUIDA
            // ==============================================================
            let animFrameId = null;
            let lastFrameTime = 0;
            let firstFrame = true;

            function animate(timestamp) {
                if (firstFrame) {
                    // El acento ya lo aplicó _postgame.js → sincronizar colores
                    syncTheme();
                    firstFrame = false;
                }
                if (!lastFrameTime) lastFrameTime = timestamp;
                const delta = timestamp - lastFrameTime;
                lastFrameTime = timestamp;

                if (isPlaying && !paused) {
                    const step = delta / speed;
                    lerpFactor = Math.min(1, lerpFactor + step);

                    if (lerpFactor >= 1) {
                        lerpFactor = 0;
                        prevPositions = snake.map(s => ({ ...s }));
                        updateGame();
                        updateUI();
                    }
                }

                const alpha = isPlaying && !paused ? Math.min(1, lerpFactor) : 1;
                draw(alpha);

                animFrameId = requestAnimationFrame(animate);
            }

            // ==============================================================
            // LÓGICA
            // ==============================================================
            function updateGame() {
                if (!isPlaying || paused) return;

                direction = nextDirection;

                const head = { ...snake[0] };
                switch (direction) {
                    case 'right': head.x++; break;
                    case 'left': head.x--; break;
                    case 'up': head.y--; break;
                    case 'down': head.y++; break;
                }

                if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                    gameOver();
                    return;
                }

                // Autocolisión excluyendo la cola: al moverse, la cola
                // abandona su celda en este mismo tick (si no se come), así
                // que entrar en ella es una jugada legal en Snake clásico.
                const willEat = food && head.x === food.x && head.y === food.y;
                if (snake.some((s, i) => s.x === head.x && s.y === head.y && !(i === snake.length - 1 && !willEat))) {
                    gameOver();
                    return;
                }

                snake.unshift(head);

                let ate = false;
                if (food && head.x === food.x && head.y === food.y) {
                    ate = true;
                    score++;
                    comboCount++;
                    showCombo(comboCount);
                    spawnParticles(food.x, food.y, THEME.red, 15);
                    sfxEat();
                    vibrate(8);

                    // Nuevo récord de puntuación
                    if (score > highScore) {
                        highScore = score;
                        recordBroken = true;
                        localStorage.setItem('snakeHighScore', highScore);
                        highScoreDisplay.textContent = highScore;
                        sfxRecord();
                        showToast('🏆 ¡Nuevo récord!');
                    }

                    // Aumentar velocidad gradual
                    if (score % 5 === 0 && speed > 45) {
                        speed -= 5;
                        sfxSpeed();
                        showToast(`⚡ Velocidad: ${Math.round(1000 / speed)} mov/seg`);
                    }

                    spawnFood();
                }

                if (specialFood && head.x === specialFood.x && head.y === specialFood.y) {
                    ate = true;
                    score += 3;
                    comboCount += 2;
                    showCombo(comboCount);
                    spawnParticles(specialFood.x, specialFood.y, THEME.gold, 20);
                    specialFood = null;
                    sfxSpecial();
                    vibrate(20);

                    if (score > highScore) {
                        highScore = score;
                        recordBroken = true;
                        localStorage.setItem('snakeHighScore', highScore);
                        highScoreDisplay.textContent = highScore;
                        sfxRecord();
                        showToast('🏆 ¡Nuevo récord!');
                    }
                }

                if (!ate) {
                    snake.pop();
                } else {
                    // Récord de longitud
                    if (snake.length > bestLength) {
                        bestLength = snake.length;
                        localStorage.setItem('snakeBestLength', bestLength);
                    }
                }
            }

            // --- Game Over ---
            function gameOver() {
                isPlaying = false;
                comboPopup.classList.remove('show');
                updateStartBtn();
                prevPositions = snake.map(s => ({ ...s }));
                sfxGameOver();
                vibrate([60, 40, 60]);

                if (recordBroken) {
                    showMessage('🏆', '¡Nuevo récord!', `Puntuación: ${score} · Longitud: ${snake.length} · Récord: ${highScore}`);
                } else {
                    showMessage('💀', '¡Game Over!', `Puntuación: ${score} · Longitud: ${snake.length} · Récord: ${highScore}`);
                }
            }

            // --- Modal ---
            function showMessage(icon, title, text) {
                document.getElementById('msgIcon').textContent = icon;
                document.getElementById('msgTitle').textContent = title;
                document.getElementById('msgText').textContent = text;
                document.getElementById('msgBtn').textContent = 'Reintentar';
                document.getElementById('gameMessage').classList.add('show');
            }

            function hideMessage() {
                document.getElementById('gameMessage').classList.remove('show');
            }

            document.getElementById('msgBtn').addEventListener('click', () => {
                hideMessage();
                resetGame();
                setTimeout(startGame, 200);
            });

            // --- Botón único: Jugar ⇄ Reiniciar ---
            function updateStartBtn() {
                startBtn.textContent = isPlaying ? '🔄 Reiniciar' : '▶ Jugar';
                startBtn.style.opacity = '1';
            }

            function startGame() {
                if (isPlaying) return;
                if (snake.length === 0) initGame();
                ensureAudio();
                isPlaying = true;
                paused = false;
                lerpFactor = 0;
                pauseBtn.textContent = '⏸️';
                updateStartBtn();
                prevPositions = snake.map(s => ({ ...s }));
                syncTheme();
            }

            function resetGame() {
                isPlaying = false;
                paused = false;
                pauseBtn.textContent = '⏸️';
                particles = [];
                specialFood = null;
                lerpFactor = 0;
                initGame();
                updateStartBtn();
            }

            function playFresh() {
                if (isPlaying) resetGame();
                startGame();
            }

            function togglePause() {
                if (!isPlaying) return;
                paused = !paused;
                pauseBtn.textContent = paused ? '▶️' : '⏸️';
                sfxPause();
                if (!paused) {
                    lerpFactor = 0;
                    prevPositions = snake.map(s => ({ ...s }));
                }
            }

            // ==============================================================
            // EVENTOS
            // ==============================================================
            startBtn.addEventListener('click', playFresh);
            pauseBtn.addEventListener('click', togglePause);
            soundBtn.addEventListener('click', () => { ensureAudio(); toggleSound(); });

            // --- Selector de velocidad ---
            function applySpeedUI() {
                document.querySelectorAll('.size-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.speed === speedPref);
                });
            }

            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    speedPref = btn.dataset.speed;
                    localStorage.setItem('snakeSpeed', speedPref);
                    applySpeedUI();
                    resetGame();
                    showToast(`Velocidad: ${btn.textContent}`);
                });
            });

            document.addEventListener('keydown', (e) => {
                const key = e.key;
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'W', 'a', 'A', 's', 'S', 'd', 'D', ' '].includes(key)) {
                    e.preventDefault();
                }

                if (key === 'Escape') {
                    hideMessage();
                    return;
                }
                if (key === 'm' || key === 'M') {
                    ensureAudio();
                    toggleSound();
                    return;
                }
                if (key === 'r' || key === 'R') {
                    resetGame();
                    return;
                }
                if (key === ' ' && isPlaying) {
                    togglePause();
                    return;
                }

                if (!isPlaying || paused) return;

                if ((key === 'ArrowUp' || key === 'w' || key === 'W') && direction !== 'down') nextDirection = 'up';
                else if ((key === 'ArrowDown' || key === 's' || key === 'S') && direction !== 'up') nextDirection = 'down';
                else if ((key === 'ArrowLeft' || key === 'a' || key === 'A') && direction !== 'right') nextDirection = 'left';
                else if ((key === 'ArrowRight' || key === 'd' || key === 'D') && direction !== 'left') nextDirection = 'right';
            });

            // Controles táctiles
            let touchStartX = 0,
                touchStartY = 0;
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                touchStartX = (touch.clientX - rect.left) / rect.width * W;
                touchStartY = (touch.clientY - rect.top) / rect.height * H;
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!isPlaying || paused || !touchStartX) return;
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const x = (touch.clientX - rect.left) / rect.width * W;
                const y = (touch.clientY - rect.top) / rect.height * H;

                const dx = x - touchStartX;
                const dy = y - touchStartY;
                const threshold = 15;

                if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0 && direction !== 'left') nextDirection = 'right';
                        else if (dx < 0 && direction !== 'right') nextDirection = 'left';
                    } else {
                        if (dy > 0 && direction !== 'up') nextDirection = 'down';
                        else if (dy < 0 && direction !== 'down') nextDirection = 'up';
                    }
                    touchStartX = x;
                    touchStartY = y;
                }
            }, { passive: false });

            canvas.addEventListener('touchend', () => {
                touchStartX = 0;
                touchStartY = 0;
            }, { passive: false });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isPlaying) {
                    paused = true;
                    pauseBtn.textContent = '▶️';
                }
                syncTheme();
            });

            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', syncTheme);

            // ==============================================================
            // INICIAR
            // ==============================================================
            applySpeedUI();
            updateSoundBtn();
            initGame();
            lastFrameTime = 0;
            animFrameId = requestAnimationFrame(animate);

            // API para pruebas
            window.startGame = startGame;
            window.resetGame = resetGame;
            window.togglePause = togglePause;
            window.toggleSound = toggleSound;
            window.getSnakeState = () => ({ score, highScore, bestLength, length: snake.length, isPlaying, paused, combo: comboCount, food, specialFood, head: snake[0] });
        })();
    </script>
    <script src="_postgame.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js')
        .catch(function(err) { console.warn('SW error:', err); });
    }
    </script>

    <script src="_online.js"></script>
</html>
