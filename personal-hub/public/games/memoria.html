<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('ph.theme');if(t){if(t==='auto'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Memoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================
           MEMORIA — integrado con el design system de la web.
           Usa los tokens de _game-ui.css (superficies, acento coral,
           tema claro) y el acento del juego (?accent=ff8aa1).
           ========================================================== */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 12px;
        }

        .game-container {
            max-width: 640px;
            width: 100%;
            margin: 16px auto;
            padding: 24px 20px;
            background: var(--surface-1);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            text-align: center;
            box-shadow: var(--elev-3);
            animation: fade-in 0.4s ease;
        }

        .game-header h1 {
            font-family: var(--font-display);
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
            margin: 0 0 2px;
        }

        .game-header .subtitle {
            color: var(--ink-dim);
            font-size: 0.8rem;
            margin-bottom: 14px;
        }

        /* ===== BARRA SUPERIOR ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }

        .stat {
            background: var(--surface-2);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 6px 12px;
            text-align: left;
            min-width: 72px;
        }

        .stat-label {
            display: block;
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--ash);
            white-space: nowrap;
        }

        .stat-value {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--ink);
        }

        .stat-value.gold { color: var(--gold); }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stars {
            font-size: 1.05rem;
            letter-spacing: 2px;
            color: var(--gold);
            text-shadow: 0 0 12px color-mix(in srgb, var(--gold) 30%, transparent);
            user-select: none;
        }

        /* ===== CATEGORÍAS ===== */
        .categories-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }

        .category-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            background: transparent;
            color: var(--ink-dim);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-body);
            white-space: nowrap;
        }

        .category-btn:hover {
            border-color: var(--border-accent);
            color: var(--ink);
            background: var(--accent-dim);
        }

        .category-btn.active {
            background: var(--accent-dim);
            border-color: var(--coral);
            color: var(--coral);
        }

        /* ===== TAMAÑO — control segmentado nativo ===== */
        .size-control {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px;
            margin-bottom: 16px;
            background: var(--surface-2);
            border: 1px solid var(--panel-border);
            border-radius: 999px;
        }

        .size-btn {
            border: none;
            background: transparent;
            color: var(--ink-dim);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-body);
        }

        .size-btn:hover { color: var(--ink); }
        .size-btn.active {
            background: var(--accent-dim);
            color: var(--coral);
            box-shadow: var(--elev-1);
        }

        /* ===== GRID ===== */
        .game-grid {
            display: grid;
            gap: 10px;
            margin: 0 0 16px;
        }

        .game-grid.grid-4x4 { grid-template-columns: repeat(4, 1fr); }
        .game-grid.grid-5x4 { grid-template-columns: repeat(5, 1fr); }
        .game-grid.grid-6x4 { grid-template-columns: repeat(6, 1fr); }

        /* ===== CARTA — volteo 3D ===== */
        .card {
            position: relative;
            aspect-ratio: 1;
            cursor: pointer;
            perspective: 900px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            opacity: 0;
            transform: translateY(10px);
            animation: cardIn 0.4s cubic-bezier(0.22, 0.9, 0.3, 1.1) forwards;
            animation-delay: var(--enter-delay, 0ms);
        }

        @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

        .card-inner {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.22, 0.9, 0.3, 1.1);
        }

        .card.flipped .card-inner,
        .card.matched .card-inner { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
        }

        .card-face--cover {
            background: var(--surface-2);
            border: 1px solid var(--panel-border);
            box-shadow: var(--elev-1);
            transition: border-color 0.2s, background 0.2s;
        }

        .card-face--cover .cover-mark {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--coral);
            opacity: 0.4;
        }

        .card:hover:not(.flipped):not(.matched) .card-face--cover {
            border-color: var(--border-accent);
            background: var(--accent-dim);
        }

        .card-face--value {
            background: linear-gradient(180deg, var(--surface-3), var(--surface-2));
            border: 1px solid var(--border-accent);
            transform: rotateY(180deg);
            font-size: 1.9rem;
            line-height: 1;
        }

        .card.matched {
            cursor: default;
            opacity: 0.72;
        }
        .card.matched .card-face--value {
            background: var(--green-dim);
            border-color: color-mix(in srgb, var(--green) 45%, transparent);
            animation: matchPop 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        .card.wrong .card-face--value {
            background: var(--red-dim);
            border-color: color-mix(in srgb, var(--red) 55%, transparent);
            animation: shake 0.4s ease;
        }

        @keyframes matchPop {
            0% { transform: rotateY(180deg) scale(1); }
            40% { transform: rotateY(180deg) scale(1.16); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: rotateY(180deg) translateX(0); }
            25% { transform: rotateY(180deg) translateX(-7px); }
            75% { transform: rotateY(180deg) translateX(7px); }
        }

        /* ===== BOTONES ===== */
        .actions-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .btn-ghost {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 999px;
            background: transparent;
            border: 1px solid var(--panel-strong);
            color: var(--ink-dim);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: var(--font-body);
            transition: all 0.2s;
        }

        .btn-ghost:hover { transform: translateY(-1px); }

        .btn-ghost.primary { color: var(--coral); }
        .btn-ghost.primary:hover {
            border-color: var(--coral);
            background: var(--accent-dim);
            color: var(--coral);
        }

        .btn-ghost.reset { color: var(--red); }
        .btn-ghost.reset:hover {
            border-color: var(--red);
            background: var(--red-dim);
            color: var(--red);
        }

        .game-back-nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            background: var(--panel);
            color: var(--ink-dim);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-btn:hover {
            border-color: var(--coral);
            color: var(--coral);
            transform: translateX(-3px);
        }

        /* ===== MODAL — estilado por _game-ui.css ===== */
        .game-message-content .btn-primary {
            min-width: 160px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .game-container { padding: 16px 12px; border-radius: 18px; }
            .game-grid { gap: 6px; }
            .card-face { border-radius: 10px; }
            .card-face--value { font-size: 1.5rem; }
            .card-face--cover .cover-mark { font-size: 1.2rem; }
            .top-bar { gap: 8px; }
            .stat { padding: 5px 10px; min-width: 60px; }
            .category-btn { font-size: 0.68rem; padding: 5px 11px; }
        }

        @media (max-width: 400px) {
            .game-grid { gap: 5px; }
            .card-face { border-radius: 8px; }
            .card-face--value { font-size: 1.3rem; }
            .stat-label { font-size: 0.52rem; }
            .stat-value { font-size: 0.85rem; }
            .size-btn { padding: 5px 12px; }
        }
    </style>
    <link rel="stylesheet" href="_theme.css">
    <link rel="stylesheet" href="_game-ui.css">
    <link rel="manifest" href="../manifest.json">

<body>
    <div class="game-container">
        <!-- ===== CABECERA ===== -->
        <div class="game-header">
            <span class="game-header__emoji" aria-hidden="true">🧠</span>
            <h1>Memoria</h1>
            <p class="subtitle">Encuentra todas las parejas</p>
        </div>

        <!-- ===== BARRA SUPERIOR ===== -->
        <div class="top-bar">
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">🎯 Movimientos</span>
                    <span class="stat-value" id="moveCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">⏱️ Tiempo</span>
                    <span class="stat-value" id="timerDisplay">0s</span>
                </div>
                <div class="stat">
                    <span class="stat-label">👫 Pares</span>
                    <span class="stat-value" id="pairCount">0/0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">🏆 Récord</span>
                    <span class="stat-value" id="recordDisplay">—</span>
                </div>
            </div>
            <div class="top-actions">
                <span class="stars" id="starsDisplay">★★★</span>
                <button class="icon-btn" id="soundBtn" title="Sonido" aria-label="Activar o silenciar sonido">🔊</button>
            </div>
        </div>

        <!-- ===== CATEGORÍAS ===== -->
        <div class="categories-bar" id="categoriesBar"></div>

        <!-- ===== TAMAÑO ===== -->
        <div class="size-control">
            <button class="size-btn active" data-size="4x4">4×4</button>
            <button class="size-btn" data-size="5x4">5×4</button>
            <button class="size-btn" data-size="6x4">6×4</button>
        </div>

        <!-- ===== GRID ===== -->
        <div class="game-grid grid-4x4" id="gameGrid"></div>

        <!-- ===== ACCIONES ===== -->
        <div class="actions-row">
            <button class="btn-ghost primary" id="newBtn">🔄 Nueva partida</button>
        </div>

        <div class="game-back-nav">
            <a href="/#/juegos" class="back-btn">← Juegos</a>
            <a href="/#/calendario" class="back-btn">← Calendario</a>
        </div>
    </div>

    <!-- ===== MODAL POSTJUEGO ===== -->
    <div class="game-message" id="gameMessage">
        <div class="game-message-content">
            <div class="icon" id="msgIcon">🎉</div>
            <h2 id="msgTitle">¡Completaste el juego!</h2>
            <p id="msgText"></p>
            <button class="btn-primary" id="msgBtn">Jugar otra vez</button>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // ==========================================================
            // CATEGORÍAS
            // ==========================================================
            const categories = {
                emojis:   { label: 'Emojis',   items: ['❤️', '🌟', '🌈', '🎵', '🌸', '✨', '🌺', '💫', '🎉', '🍀', '🦋', '🌊'] },
                animales: { label: 'Animales', items: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🦁', '🐮', '🐷'] },
                frutas:   { label: 'Frutas',   items: ['🍎', '🍐', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓', '🫐', '🍑', '🍒', '🥝'] },
                formas:   { label: 'Formas',   items: ['⬛', '⬜', '🔴', '🟠', '🟡', '🟢', '🔵', '🟣', '🟤', '⚫', '⚪', '🔶'] },
                comida:   { label: 'Comida',   items: ['🍕', '🍔', '🌮', '🌯', '🍣', '🍱', '🥘', '🍲', '🍝', '🍜', '🍛', '🥗'] },
                cultura:  { label: 'Cultura',  items: ['🎭', '🎨', '🎪', '🎬', '🎵', '🎶', '🎸', '🎹', '🎺', '🎻', '🥁', '🎤'] }
            };

            // ==========================================================
            // ESTADO
            // ==========================================================
            let currentCategory = 'emojis';
            let currentGridSize = '4x4';
            let cards = [];
            let flipped = [];
            let matched = [];
            let moves = 0;
            let pairs = 0;
            let totalPairs = 0;
            let timerSeconds = 0;
            let timerInterval = null;
            let isLocked = false;
            let gameFinished = false;
            let paused = false;

            // ==========================================================
            // DOM
            // ==========================================================
            const grid = document.getElementById('gameGrid');
            const moveCount = document.getElementById('moveCount');
            const timerDisplay = document.getElementById('timerDisplay');
            const pairCount = document.getElementById('pairCount');
            const starsDisplay = document.getElementById('starsDisplay');
            const recordDisplay = document.getElementById('recordDisplay');
            const categoriesBar = document.getElementById('categoriesBar');
            const sizeBtns = document.querySelectorAll('.size-btn');
            const gameMessage = document.getElementById('gameMessage');
            const msgIcon = document.getElementById('msgIcon');
            const msgTitle = document.getElementById('msgTitle');
            const msgText = document.getElementById('msgText');
            const msgBtn = document.getElementById('msgBtn');
            const soundBtn = document.getElementById('soundBtn');
            const newBtn = document.getElementById('newBtn');

            // ==========================================================
            // SONIDO (WebAudio — sin assets) + vibración
            // ==========================================================
            let audioCtx = null;
            let soundOn = localStorage.getItem('memoriaSound') !== 'off';

            function tone(freq, dur, type, vol, when) {
                if (!soundOn) return;
                try {
                    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const t0 = audioCtx.currentTime + (when || 0);
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = type || 'sine';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(vol || 0.05, t0);
                    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(t0);
                    o.stop(t0 + dur + 0.03);
                } catch (e) { /* sin audio: no pasa nada */ }
            }

            const sfx = {
                flip:  () => tone(540, 0.06, 'triangle', 0.035),
                match: () => { tone(523.25, 0.09, 'sine', 0.05); tone(783.99, 0.12, 'sine', 0.05, 0.08); },
                wrong: () => tone(165, 0.16, 'sawtooth', 0.035),
                win:   () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.16, 'sine', 0.05, i * 0.11))
            };

            function updateSoundBtn() {
                soundBtn.textContent = soundOn ? '🔊' : '🔇';
            }
            soundBtn.addEventListener('click', () => {
                soundOn = !soundOn;
                localStorage.setItem('memoriaSound', soundOn ? 'on' : 'off');
                updateSoundBtn();
            });

            // ==========================================================
            // RÉCORDS (localStorage)
            // ==========================================================
            function loadBest() {
                try { return JSON.parse(localStorage.getItem('memoriaBest') || 'null'); }
                catch (e) { return null; }
            }
            function saveBest(b) { localStorage.setItem('memoriaBest', JSON.stringify(b)); }

            function updateRecordDisplay() {
                const b = loadBest();
                recordDisplay.textContent = b ? `${b.moves}m · ${b.time}s` : '—';
                recordDisplay.classList.toggle('gold', !!b);
            }

            // ==========================================================
            // TEMPORIZADOR
            // ==========================================================
            function startTimer(resetTimer) {
                if (timerInterval) return;
                if (resetTimer !== false) timerSeconds = 0;
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    timerDisplay.textContent = `${timerSeconds}s`;
                }, 1000);
            }
            function stopTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            // ==========================================================
            // LÓGICA DEL JUEGO
            // ==========================================================
            function getGridSize() {
                return { '4x4': 4, '5x4': 5, '6x4': 6 }[currentGridSize] || 4;
            }

            function getCategoryItems() {
                const items = categories[currentCategory].items;
                const needed = (getGridSize() * 4) / 2;
                return [...items].sort(() => Math.random() - 0.5).slice(0, needed);
            }

            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            function initGame() {
                stopTimer();
                paused = false;
                gameFinished = false;
                timerSeconds = 0;
                timerDisplay.textContent = '0s';

                const items = getCategoryItems();
                cards = shuffle([...items, ...items]);
                flipped = [];
                matched = [];
                moves = 0;
                pairs = 0;
                totalPairs = items.length;
                isLocked = false;

                moveCount.textContent = '0';
                pairCount.textContent = `0/${totalPairs}`;
                updateStars();

                grid.className = `game-grid grid-${currentGridSize}`;
                createCards();
            }

            function createCards() {
                grid.innerHTML = '';
                cards.forEach((item, i) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.index = i;
                    card.style.setProperty('--enter-delay', `${Math.min(i * 24, 400)}ms`);
                    card.innerHTML = `
                        <div class="card-inner">
                            <div class="card-face card-face--cover"><span class="cover-mark">?</span></div>
                            <div class="card-face card-face--value">${item}</div>
                        </div>`;
                    card.addEventListener('click', () => flipCard(i));
                    grid.appendChild(card);
                });
            }

            function flipCard(index) {
                if (isLocked || gameFinished) return;
                if (flipped.includes(index) || matched.includes(index)) return;
                if (flipped.length >= 2) return;

                if (moves === 0 && flipped.length === 0) startTimer();

                flipped.push(index);
                grid.children[index].classList.add('flipped');
                sfx.flip();

                if (flipped.length === 2) {
                    moves++;
                    moveCount.textContent = moves;
                    updateStars();

                    const [i1, i2] = flipped;
                    if (cards[i1] === cards[i2] && i1 !== i2) {
                        matched.push(i1, i2);
                        pairs++;
                        pairCount.textContent = `${pairs}/${totalPairs}`;
                        sfx.match();
                        if (navigator.vibrate) navigator.vibrate(15);

                        setTimeout(() => {
                            grid.children[i1].classList.add('matched');
                            grid.children[i2].classList.add('matched');
                        }, 280);

                        flipped = [];

                        if (pairs === totalPairs) {
                            gameFinished = true;
                            stopTimer();
                            setTimeout(showVictory, 480);
                        }
                    } else {
                        isLocked = true;
                        grid.children[i1].classList.add('wrong');
                        grid.children[i2].classList.add('wrong');
                        sfx.wrong();
                        if (navigator.vibrate) navigator.vibrate(60);

                        setTimeout(() => {
                            grid.children[i1].classList.remove('flipped', 'wrong');
                            grid.children[i2].classList.remove('flipped', 'wrong');
                            flipped = [];
                            isLocked = false;
                        }, 650);
                    }
                }
            }

            // ==========================================================
            // ESTRELLAS
            // ==========================================================
            function getStarCount() {
                const maxMoves = totalPairs * 1.8;
                if (moves <= maxMoves * 0.4) return 3;
                if (moves <= maxMoves * 0.7) return 2;
                return 1;
            }

            function updateStars() {
                const n = getStarCount();
                starsDisplay.textContent = '★'.repeat(n) + '☆'.repeat(3 - n);
            }

            function starText(n) {
                return n === 3 ? '¡Excelente!' : n === 2 ? '¡Bien hecho!' : '¡No está mal!';
            }

            // ==========================================================
            // VICTORIA
            // ==========================================================
            function showVictory() {
                const n = getStarCount();
                let extra = '';
                const best = loadBest();
                const isRecord = !best || moves < best.moves || (moves === best.moves && timerSeconds < best.time);
                if (isRecord) {
                    saveBest({ moves, time: timerSeconds });
                    extra = ' · Récord: Nuevo 🏆';
                    updateRecordDisplay();
                }

                msgIcon.textContent = '🎉';
                msgTitle.textContent = starText(n);
                msgText.textContent = `Movimientos: ${moves} · Tiempo: ${timerSeconds}s · Estrellas: ${'★'.repeat(n)}${extra}`;

                sfx.win();
                if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
                gameMessage.classList.add('show');
            }

            function hideModal() {
                gameMessage.classList.remove('show');
            }

            function newGame() {
                hideModal();
                initGame();
            }

            // ==========================================================
            // CATEGORÍAS Y TAMAÑO
            // ==========================================================
            function renderCategories() {
                categoriesBar.innerHTML = Object.keys(categories).map(key => `
                    <button class="category-btn ${key === currentCategory ? 'active' : ''}" data-category="${key}">
                        ${categories[key].label}
                    </button>
                `).join('');

                categoriesBar.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (btn.dataset.category !== currentCategory) {
                            currentCategory = btn.dataset.category;
                            categoriesBar.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            newGame();
                        }
                    });
                });
            }

            sizeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.dataset.size !== currentGridSize) {
                        currentGridSize = btn.dataset.size;
                        sizeBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        newGame();
                    }
                });
            });

            // ==========================================================
            // EVENTOS
            // ==========================================================
            newBtn.addEventListener('click', newGame);
            msgBtn.addEventListener('click', newGame);
            gameMessage.addEventListener('click', (e) => {
                if (e.target === gameMessage) hideModal();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') hideModal();
                if (e.key === 'r' || e.key === 'R') newGame();
                if (e.key === 'n' || e.key === 'N') newGame();
            });

            // Auto-pausa: pestaña oculta → cronómetro detenido y tablero bloqueado
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (!gameFinished && !paused && (timerInterval || flipped.length > 0)) {
                        paused = true;
                        isLocked = true;
                        stopTimer();
                    }
                } else if (paused) {
                    paused = false;
                    if (!gameFinished) {
                        if (timerInterval === null && (moves > 0 || flipped.length > 0)) {
                            startTimer(false);
                        }
                        if (isLocked && flipped.length === 2) {
                            setTimeout(() => {
                                flipped = [];
                                isLocked = false;
                            }, 60);
                        } else {
                            isLocked = false;
                        }
                    } else {
                        isLocked = false;
                    }
                }
            });

            // ==========================================================
            // INICIO
            // ==========================================================
            updateSoundBtn();
            updateRecordDisplay();
            renderCategories();
            initGame();
        })();
    </script>

    <script src="_postgame.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js')
        .catch(function(err) { console.warn('SW error:', err); });
    }
    </script>

    <script src="_online.js"></script>
</html>
