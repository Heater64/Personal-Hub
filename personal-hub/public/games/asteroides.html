<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('ph.theme');if(t){if(t==='auto'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Asteroides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_theme.css">
    <link rel="stylesheet" href="_game-ui.css">
    <link rel="manifest" href="../manifest.json">
    <style>
        /* Asteroides: canvas cuadrado protagonista, HUD compacto, móvil edge-to-edge */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .game-container {
            width: min(100%, 680px);
            padding: 18px 24px 34px;
        }

        .game-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-areas: "copy toolbar" "subtitle subtitle";
            align-items: center;
            gap: 4px 14px;
            margin: 0 auto 15px;
            text-align: left;
        }

        .game-header h1 {
            grid-area: copy;
            font-size: clamp(1.45rem, 2.8vw, 1.9rem);
            line-height: 1.05;
        }

        .game-header .subtitle {
            grid-area: subtitle;
            width: auto;
            margin: 0;
            text-align: left;
            font-size: 0.72rem;
        }

        .game-header__emoji {
            display: none;
        }

        .toolbar {
            grid-area: toolbar;
            justify-self: end;
        }

        .icon-btn {
            width: auto;
            min-width: 42px;
            min-height: 42px;
            padding: 0 13px;
            border-radius: 13px;
            font-family: var(--font-body);
            font-size: 0.72rem;
            font-weight: 700;
        }

        .score-display {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            width: min(100%, 560px);
            margin: 0 auto 14px;
        }

        .score-item {
            min-width: 0;
            padding: 9px 10px 8px;
            border-radius: 15px;
            background: linear-gradient(145deg, var(--surface-2), var(--panel));
            box-shadow: var(--elev-1);
        }

        .score-item .label {
            display: block;
            margin-bottom: 2px;
            font-size: 0.5rem;
            letter-spacing: 0.1em;
        }

        .score-item .value {
            font-size: 1.18rem;
            line-height: 1.1;
        }

        .canvas-wrap {
            width: min(100%, 480px, calc(100dvh - 350px));
            max-width: 480px;
            padding: 6px;
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            background: linear-gradient(145deg, var(--surface-2), rgba(232, 115, 90, 0.07));
            box-shadow: var(--elev-3), 0 0 38px rgba(232, 115, 90, 0.1);
        }

        canvas {
            width: 100%;
            max-width: none;
            aspect-ratio: 1 / 1;
            border: 0;
            border-radius: 18px;
            outline: none;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
            touch-action: none;
        }

        .controls-hint {
            width: min(100%, 560px);
            margin: 10px auto 0;
            padding: 8px 12px;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            background: var(--panel);
            color: var(--ink-dim);
            font-size: 0.66rem;
            line-height: 1.45;
        }

        .actions {
            width: min(100%, 560px);
            margin: 12px auto 0;
        }

        .actions .btn-primary {
            min-width: 170px;
            min-height: 44px;
            font-size: 0.82rem;
        }

        @media (max-width: 600px) {
            .game-container {
                width: 100%;
                max-width: none;
                min-height: 100dvh;
                padding: max(14px, env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
            }

            .game-header {
                grid-template-columns: 1fr auto;
                margin-bottom: 10px;
                text-align: center;
            }

            .game-header h1 {
                grid-column: 1 / -1;
                font-size: 1.3rem;
            }

            .game-header .subtitle {
                text-align: center;
                font-size: 0.68rem;
            }

            .score-display {
                max-width: none;
                gap: 5px;
                margin-bottom: 10px;
            }

            .score-item {
                padding: 7px 4px 6px;
                border-radius: 13px;
            }

            .score-item .label {
                font-size: 0.42rem;
                letter-spacing: 0.05em;
            }

            .score-item .value {
                font-size: 0.95rem;
            }

            .canvas-wrap {
                width: min(100%, calc(100dvh - 350px));
                max-width: none;
                padding: 5px;
                border-radius: 20px;
            }

            canvas {
                border-radius: 15px;
            }

            .controls-hint {
                margin: 8px auto 0;
                font-size: 0.63rem;
            }

            .actions {
                margin: 10px auto 0;
            }

            .actions .btn-primary {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Asteroides</h1>
            <div class="toolbar">
                <button class="icon-btn" id="pauseBtn" title="Pausa" aria-label="Pausar">⏸️ Pausa</button>
            </div>
            <span class="subtitle">Destruye las rocas · Sobrevive al espacio</span>
        </div>

        <div class="score-display">
            <div class="score-item"><span class="label">Puntos</span><span class="value gold" id="scoreDisplay">0</span></div>
            <div class="score-item"><span class="label">Récord</span><span class="value green" id="highScoreDisplay">0</span></div>
            <div class="score-item"><span class="label">Vidas</span><span class="value red" id="livesDisplay">3</span></div>
            <div class="score-item"><span class="label">Nivel</span><span class="value white" id="levelDisplay">1</span></div>
        </div>

        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="480" height="480" tabindex="0" aria-label="Asteroides. Flechas para girar y empujar, espacio para disparar"></canvas>
        </div>

        <div class="controls-hint" aria-label="Controles">
            <span>← → girar · ↑ empujar · Espacio disparar · P pausa · En móvil: arrastra para dirigir</span>
        </div>

        <div class="actions">
            <button class="btn-primary" id="resetBtn">🔄 Reiniciar</button>
        </div>
    </div>

    <div class="game-message" id="gameMessage">
        <div class="game-message-content">
            <div class="icon" id="msgIcon">💀</div>
            <h2 id="msgTitle">¡Game Over!</h2>
            <p id="msgText">Puntuación: 0 · Nivel: 1 · Récord: 0</p>
            <button class="btn-primary" id="msgBtn">Reintentar</button>
        </div>
    </div>

    <script>
    (() => {
        'use strict';
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 480, H = 480;

        let ship, rocks, bullets, particles, score, highScore, lives, level, running, paused, gameOver, lastTime, animId, invuln, angle, thrusting;
        const pauseBtn = document.getElementById('pauseBtn');

        highScore = parseInt(localStorage.getItem('asteroidesHighScore') || '0', 10);
        document.getElementById('highScoreDisplay').textContent = highScore;

        function makeRock(x, y, size, vx, vy) {
            const pts = [];
            const n = 8 + Math.floor(Math.random() * 4);
            for (let i = 0; i < n; i++) pts.push(1 - Math.random() * 0.4);
            return { x, y, vx: vx || (Math.random() - 0.5) * 2, vy: vy || (Math.random() - 0.5) * 2, size, pts, rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.03 };
        }

        function startLevel() {
            rocks = [];
            const count = 3 + level;
            for (let i = 0; i < count; i++) {
                const x = Math.random() * W, y = Math.random() * H;
                if (Math.hypot(x - W / 2, y - H / 2) < 120) continue;
                rocks.push(makeRock(x, y, 44));
            }
            while (rocks.length < count) rocks.push(makeRock(Math.random() * W, Math.random() * H, 44));
            bullets = [];
        }

        function resetGame() {
            ship = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
            angle = -Math.PI / 2;
            score = 0; lives = 3; level = 1;
            invuln = 1800;
            running = true; paused = false; gameOver = false;
            pauseBtn.textContent = '⏸️ Pausa';
            pauseBtn.setAttribute('aria-label', 'Pausar');
            document.getElementById('gameMessage').classList.remove('show');
            startLevel();
            updateUI();
        }

        function update(dt) {
            if (paused || !running || gameOver) return;
            const s = dt / 16.7;

            // nave
            if (thrusting) {
                ship.vx += Math.cos(angle) * 0.18 * s;
                ship.vy += Math.sin(angle) * 0.18 * s;
            }
            ship.x += ship.vx * s;
            ship.y += ship.vy * s;
            ship.x = (ship.x + W) % W;
            ship.y = (ship.y + H) % H;
            ship.vx *= 0.995;
            ship.vy *= 0.995;

            // rocas
            for (const r of rocks) {
                r.x += r.vx * s; r.y += r.vy * s;
                r.x = (r.x + W) % W; r.y = (r.y + H) % H;
                r.rot += r.vr * s;
            }
            // balas
            for (const b of bullets) {
                b.x += b.vx * s; b.y += b.vy * s;
                b.life -= s;
            }
            bullets = bullets.filter(b => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
            // partículas
            particles = particles.filter(p => (p.life -= s) > 0);

            // balas vs rocas
            for (const b of bullets) {
                for (let i = rocks.length - 1; i >= 0; i--) {
                    const r = rocks[i];
                    if (Math.hypot(b.x - r.x, b.y - r.y) < r.size) {
                        b.dead = true;
                        rocks.splice(i, 1);
                        score += Math.round(100 / r.size * 10);
                        SFX.point();
                        buzz(8);
                        particles.push({ x: r.x, y: r.y, life: 30 });
                        if (r.size > 18) {
                            rocks.push(makeRock(r.x, r.y, r.size * 0.55, r.vx + 1, r.vy - 1));
                            rocks.push(makeRock(r.x, r.y, r.size * 0.55, r.vx - 1, r.vy + 1));
                        }
                        if (score > highScore) { highScore = score; localStorage.setItem('asteroidesHighScore', highScore); SFX.record(); }
                        updateUI();
                    }
                }
            }
            bullets = bullets.filter(b => !b.dead);

            // nave vs rocas
            invuln = Math.max(0, invuln - dt);
            if (invuln <= 0) {
                for (const r of rocks) {
                    if (Math.hypot(ship.x - r.x, ship.y - r.y) < r.size + 10) {
                        invuln = 1500;
                        lives--;
                        SFX.hit();
                        buzz(30);
                        particles.push({ x: ship.x, y: ship.y, life: 40 });
                        document.getElementById('livesDisplay').textContent = lives;
                        if (lives <= 0) { gameOverFn(); return; }
                    }
                }
            }

            // nivel
            if (rocks.length === 0) {
                level++;
                SFX.win();
                buzz(15);
                document.getElementById('levelDisplay').textContent = level;
                startLevel();
                updateUI();
            }
        }

        function gameOverFn() {
            gameOver = true;
            SFX.lose();
            buzz([60, 40, 60]);
            const record = score > 0 && score >= highScore;
            showMessage(record ? '🏆' : '💀', record ? '¡Nuevo récord!' : '¡Game Over!', `Puntuación: ${score} · Nivel: ${level} · Récord: ${highScore}`);
        }

        function shoot() {
            if (!running || paused || gameOver) return;
            if (bullets.length < 4) {
                bullets.push({ x: ship.x + Math.cos(angle) * 18, y: ship.y + Math.sin(angle) * 18, vx: Math.cos(angle) * 7 + ship.vx, vy: Math.sin(angle) * 7 + ship.vy, life: 70 });
                SFX.click();
            }
        }

        function showMessage(icon, title, text) {
            document.getElementById('msgIcon').textContent = icon;
            document.getElementById('msgTitle').textContent = title;
            document.getElementById('msgText').textContent = text;
            document.getElementById('msgBtn').textContent = 'Reintentar';
            document.getElementById('gameMessage').classList.add('show');
        }

        function updateUI() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('highScoreDisplay').textContent = highScore;
            document.getElementById('livesDisplay').textContent = lives;
            document.getElementById('levelDisplay').textContent = level;
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-deep') || '#0a0a0c';
            ctx.fillRect(0, 0, W, H);
            // estrellas
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            for (let i = 0; i < 60; i++) ctx.fillRect((i * 83) % W, (i * 47) % H, 2, 2);
            // rocas
            for (const r of rocks) {
                ctx.save();
                ctx.translate(r.x, r.y);
                ctx.rotate(r.rot);
                ctx.beginPath();
                for (let i = 0; i < r.pts.length; i++) {
                    const a = (i / r.pts.length) * Math.PI * 2;
                    const rad = r.size * r.pts[i];
                    if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
                    else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.restore();
            }
            // balas
            ctx.fillStyle = '#ffd166';
            for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
            // partículas
            ctx.fillStyle = 'rgba(255,209,102,0.5)';
            for (const p of particles) ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
            // nave
            if (invuln <= 0 || Math.floor(Date.now() / 120) % 2 === 0) {
                ctx.save();
                ctx.translate(ship.x, ship.y);
                ctx.rotate(angle);
                ctx.strokeStyle = '#e8735a';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(20, 0); ctx.lineTo(-14, -12); ctx.lineTo(-7, 0); ctx.lineTo(-14, 12); ctx.closePath();
                ctx.stroke();
                if (thrusting) {
                    ctx.fillStyle = '#ffd166';
                    ctx.beginPath(); ctx.moveTo(-10, -5); ctx.lineTo(-22, 0); ctx.lineTo(-10, 5); ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }
            // Overlay de pausa
            if (paused) {
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.font = '700 26px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏸️ Pausa', W / 2, H / 2);
            }
        }

        function loop(ts) {
            if (!lastTime) lastTime = ts;
            const dt = Math.min(ts - lastTime, 50);
            lastTime = ts;
            update(dt);
            draw();
            animId = requestAnimationFrame(loop);
        }

        function togglePause() {
            if (gameOver) return;
            paused = !paused;
            pauseBtn.textContent = paused ? '▶️ Reanudar' : '⏸️ Pausa';
            pauseBtn.setAttribute('aria-label', paused ? 'Reanudar' : 'Pausar');
            pauseBtn.title = paused ? 'Reanudar' : 'Pausar';
            SFX.pause();
            draw();
        }

        pauseBtn.addEventListener('click', togglePause);
        document.getElementById('msgBtn').addEventListener('click', () => { document.getElementById('gameMessage').classList.remove('show'); resetGame(); });
        document.getElementById('resetBtn').addEventListener('click', () => { resetGame(); SFX.click(); });

        const keys = {};
        document.addEventListener('keydown', (e) => {
            if (['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key)) e.preventDefault();
            if (e.key === ' ' || e.key === 'Space') { shoot(); return; }
            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); return; }
            keys[e.key] = true;
        });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });

        const baseUpdate = update;
        update = function (dt) {
            if (!paused && !gameOver) {
                if (keys['ArrowLeft'] || keys['a'] || keys['A']) angle -= 0.06 * dt / 16.7;
                if (keys['ArrowRight'] || keys['d'] || keys['D']) angle += 0.06 * dt / 16.7;
                thrusting = !!(keys['ArrowUp'] || keys['w'] || keys['W']);
            }
            baseUpdate(dt);
        };

        // táctil: arrastra hacia el punto para dirigir la nave
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = (t.clientX - rect.left) / rect.width * W;
            const y = (t.clientY - rect.top) / rect.height * H;
            angle = Math.atan2(y - ship.y, x - ship.x);
            thrusting = true;
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = (t.clientX - rect.left) / rect.width * W;
            const y = (t.clientY - rect.top) / rect.height * H;
            angle = Math.atan2(y - ship.y, x - ship.x);
        }, { passive: false });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); thrusting = false; shoot(); }, { passive: false });
        canvas.addEventListener('mousemove', (e) => {
            if (paused || gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * W;
            const y = (e.clientY - rect.top) / rect.height * H;
            angle = Math.atan2(y - ship.y, x - ship.x);
        });
        canvas.addEventListener('mousedown', () => { thrusting = true; });
        canvas.addEventListener('mouseup', () => { thrusting = false; shoot(); });

        document.addEventListener('visibilitychange', () => { if (document.hidden && running && !paused && !gameOver) togglePause(); });

        particles = [];
        resetGame();
        lastTime = 0;
        animId = requestAnimationFrame(loop);

        window.__asteroides = { resetGame, shoot, togglePause, get state() { return { score, highScore, lives, level, gameOver, paused }; } };
    })();
    </script>
    <script src="_interface.js"></script>
    <script src="_postgame.js"></script>
    <script src="_online.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js').catch(function(err) { console.warn('SW error:', err); });
    }
    </script>
</html>
