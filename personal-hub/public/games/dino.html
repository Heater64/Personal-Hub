<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('ph.theme');if(t){if(t==='auto'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dino Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_theme.css">
    <link rel="stylesheet" href="_game-ui.css">
    <link rel="manifest" href="../manifest.json">
    <style>
        /* Dino Run: canvas panorámico protagonista, HUD compacto, móvil edge-to-edge */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .game-container {
            width: min(100%, 760px);
            padding: 18px 24px 34px;
        }

        .game-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-areas: "copy toolbar" "subtitle subtitle";
            align-items: center;
            gap: 4px 14px;
            margin: 0 auto 15px;
            text-align: left;
        }

        .game-header h1 {
            grid-area: copy;
            font-size: clamp(1.45rem, 2.8vw, 1.9rem);
            line-height: 1.05;
        }

        .game-header .subtitle {
            grid-area: subtitle;
            width: auto;
            margin: 0;
            text-align: left;
            font-size: 0.72rem;
        }

        .game-header__emoji {
            display: none;
        }

        .toolbar {
            grid-area: toolbar;
            justify-self: end;
        }

        .icon-btn {
            width: auto;
            min-width: 42px;
            min-height: 42px;
            padding: 0 13px;
            border-radius: 13px;
            font-family: var(--font-body);
            font-size: 0.72rem;
            font-weight: 700;
        }

        .icon-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .score-display {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            width: min(100%, 560px);
            margin: 0 auto 14px;
        }

        .score-item {
            min-width: 0;
            padding: 9px 10px 8px;
            border-radius: 15px;
            background: linear-gradient(145deg, var(--surface-2), var(--panel));
            box-shadow: var(--elev-1);
        }

        .score-item .label {
            display: block;
            margin-bottom: 2px;
            font-size: 0.5rem;
            letter-spacing: 0.1em;
        }

        .score-item .value {
            font-size: 1.18rem;
            line-height: 1.1;
        }

        .canvas-wrap {
            width: min(100%, 560px, calc((100dvh - 330px) * 28 / 15));
            max-width: 560px;
            padding: 6px;
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            background: linear-gradient(145deg, var(--surface-2), rgba(232, 115, 90, 0.07));
            box-shadow: var(--elev-3), 0 0 38px rgba(232, 115, 90, 0.1);
        }

        canvas {
            width: 100%;
            max-width: none;
            aspect-ratio: 28 / 15;
            border: 0;
            border-radius: 18px;
            outline: none;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
            touch-action: none;
            cursor: pointer;
        }

        .controls-hint {
            width: min(100%, 560px);
            margin: 10px auto 0;
            padding: 8px 12px;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            background: var(--panel);
            color: var(--ink-dim);
            font-size: 0.66rem;
            line-height: 1.45;
        }

        .actions {
            width: min(100%, 560px);
            margin: 12px auto 0;
        }

        .actions .btn-primary {
            min-width: 170px;
            min-height: 44px;
            font-size: 0.82rem;
        }

        @media (max-width: 600px) {
            .game-container {
                width: 100%;
                max-width: none;
                min-height: 100dvh;
                padding: max(14px, env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
            }

            .game-header {
                grid-template-columns: 1fr auto;
                margin-bottom: 10px;
                text-align: center;
            }

            .game-header h1 {
                grid-column: 1 / -1;
                font-size: 1.3rem;
            }

            .game-header .subtitle {
                text-align: center;
                font-size: 0.68rem;
            }

            .score-display {
                max-width: none;
                gap: 5px;
                margin-bottom: 10px;
            }

            .score-item {
                padding: 7px 4px 6px;
                border-radius: 13px;
            }

            .score-item .label {
                font-size: 0.42rem;
                letter-spacing: 0.05em;
            }

            .score-item .value {
                font-size: 0.95rem;
            }

            .canvas-wrap {
                width: min(100%, calc((100dvh - 330px) * 28 / 15));
                max-width: none;
                padding: 5px;
                border-radius: 20px;
            }

            canvas {
                border-radius: 15px;
            }

            .controls-hint {
                margin: 8px auto 0;
                font-size: 0.63rem;
            }

            .actions {
                margin: 10px auto 0;
            }

            .actions .btn-primary {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Dino Run</h1>
            <div class="toolbar">
                <button class="icon-btn" id="pauseBtn" title="Pausa" aria-label="Pausar">⏸️ Pausa</button>
            </div>
            <span class="subtitle">Corre sin parar · Salta los obstáculos</span>
        </div>

        <div class="score-display">
            <div class="score-item"><span class="label">Puntos</span><span class="value gold" id="scoreDisplay">0</span></div>
            <div class="score-item"><span class="label">Récord</span><span class="value green" id="highScoreDisplay">0</span></div>
            <div class="score-item"><span class="label">Velocidad</span><span class="value red" id="speedDisplay">1</span></div>
        </div>

        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="560" height="300" tabindex="0" aria-label="Dino Run. Espacio, clic o toque para saltar"></canvas>
        </div>

        <div class="controls-hint" aria-label="Controles">
            <span>Espacio, clic o toque para saltar · P pausa</span>
        </div>

        <div class="actions">
            <button class="btn-primary" id="resetBtn">🔄 Reiniciar</button>
        </div>
    </div>

    <div class="game-message" id="gameMessage">
        <div class="game-message-content">
            <div class="icon" id="msgIcon">💀</div>
            <h2 id="msgTitle">¡Game Over!</h2>
            <p id="msgText">Puntuación: 0 · Récord: 0</p>
            <button class="btn-primary" id="msgBtn">Reintentar</button>
        </div>
    </div>

    <script>
    (() => {
        'use strict';
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 560, H = 300, GROUND = H - 46;

        let dino, obstacles, score, highScore, speed, running, paused, gameOver, lastTime, animId, scrollX, canJump;
        const pauseBtn = document.getElementById('pauseBtn');

        highScore = parseInt(localStorage.getItem('dinoHighScore') || '0', 10);
        document.getElementById('highScoreDisplay').textContent = highScore;

        function resetGame() {
            dino = { x: 70, y: GROUND - 42, w: 40, h: 42, vy: 0, onGround: true };
            obstacles = [];
            score = 0;
            speed = 6;
            running = true;
            paused = false;
            gameOver = false;
            scrollX = 0;
            pauseBtn.textContent = '⏸️ Pausa';
            pauseBtn.setAttribute('aria-label', 'Pausar');
            document.getElementById('gameMessage').classList.remove('show');
            updateUI();
        }

        function jump() {
            if (!running || paused || gameOver) return;
            if (dino.onGround) {
                dino.vy = -13;
                dino.onGround = false;
                SFX.click();
            }
        }

        function spawnObstacle() {
            const type = Math.random();
            if (type < 0.5) obstacles.push({ x: W + 20, w: 22, h: 40 });
            else if (type < 0.8) obstacles.push({ x: W + 20, w: 16, h: 54 });
            else obstacles.push({ x: W + 20, w: 34, h: 34 });
        }

        function update(dt) {
            if (paused || !running || gameOver) return;
            const s = dt / 16.7;
            scrollX += speed * s;
            speed = 6 + Math.min(8, score * 0.06);

            // dino física
            if (!dino.onGround) {
                dino.vy += 0.7 * s;
                dino.y += dino.vy * s;
                if (dino.y >= GROUND - 42) { dino.y = GROUND - 42; dino.vy = 0; dino.onGround = true; }
            }

            // obstáculos
            for (const o of obstacles) o.x -= speed * s;
            obstacles = obstacles.filter(o => o.x > -40);
            if (Math.random() < 0.012 * s) spawnObstacle();

            // puntuación (distancia)
            score += Math.floor(s * speed * 0.1);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('dinoHighScore', highScore);
                if (score % 50 === 0) SFX.record();
            }
            updateUI();

            // colisión
            for (const o of obstacles) {
                const dinoW = dino.w - 10, dinoH = dino.h - 6;
                if (dino.x + 6 < o.x + o.w && dino.x + dinoW > o.x && dino.y + 6 < GROUND && dino.y + dinoH > GROUND - o.h) {
                    die();
                    return;
                }
            }
        }

        function die() {
            gameOver = true;
            SFX.lose();
            buzz([60, 40, 60]);
            const record = score > 0 && score >= highScore;
            showMessage(record ? '🏆' : '💀', record ? '¡Nuevo récord!' : '¡Game Over!', `Puntuación: ${score} · Récord: ${highScore}`);
        }

        function showMessage(icon, title, text) {
            document.getElementById('msgIcon').textContent = icon;
            document.getElementById('msgTitle').textContent = title;
            document.getElementById('msgText').textContent = text;
            document.getElementById('msgBtn').textContent = 'Reintentar';
            document.getElementById('gameMessage').classList.add('show');
        }

        function updateUI() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('highScoreDisplay').textContent = highScore;
            document.getElementById('speedDisplay').textContent = Math.floor(speed);
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-deep') || '#0a0a0c';
            ctx.fillRect(0, 0, W, H);
            // suelo
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(0, GROUND, W, 3);
            // rayas del suelo en movimiento
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            for (let i = 0; i < 24; i++) {
                const x = ((i * 46) - (scrollX % 46));
                ctx.fillRect(x, GROUND + 12, 22, 3);
            }
            // obstáculos (cactus)
            for (const o of obstacles) {
                ctx.fillStyle = '#4ade80';
                ctx.fillRect(o.x, GROUND - o.h, o.w, o.h);
                ctx.fillRect(o.x + o.w / 2 - 3, GROUND - o.h - 14, 6, 14);
            }
            // dino
            ctx.fillStyle = '#e8735a';
            ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
            ctx.fillStyle = '#fff';
            ctx.fillRect(dino.x + 24, dino.y + 8, 6, 6);
            ctx.fillStyle = '#222';
            ctx.fillRect(dino.x + 27, dino.y + 8, 3, 3);
            // patas (animación simple)
            ctx.fillStyle = '#e8735a';
            if (dino.onGround) {
                const leg = Math.floor(Date.now() / 120) % 2;
                ctx.fillRect(dino.x + 6, dino.y + dino.h - 8, 8, leg ? 8 : 14);
                ctx.fillRect(dino.x + 26, dino.y + dino.h - 8, 8, leg ? 14 : 8);
            }
            if (!running) {
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.font = '600 20px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Salta para empezar', W / 2, H / 2 - 40);
            }
            // Overlay de pausa
            if (paused) {
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.font = '700 24px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏸️ Pausa', W / 2, H / 2);
            }
        }

        function loop(ts) {
            if (!lastTime) lastTime = ts;
            const dt = Math.min(ts - lastTime, 50);
            lastTime = ts;
            update(dt);
            draw();
            animId = requestAnimationFrame(loop);
        }

        function togglePause() {
            if (gameOver) return;
            paused = !paused;
            pauseBtn.textContent = paused ? '▶️ Reanudar' : '⏸️ Pausa';
            pauseBtn.setAttribute('aria-label', paused ? 'Reanudar' : 'Pausar');
            pauseBtn.title = paused ? 'Reanudar' : 'Pausar';
            SFX.pause();
            draw();
        }

        pauseBtn.addEventListener('click', togglePause);
        document.getElementById('msgBtn').addEventListener('click', () => { document.getElementById('gameMessage').classList.remove('show'); resetGame(); });
        document.getElementById('resetBtn').addEventListener('click', () => { resetGame(); SFX.click(); });

        const doJump = (e) => {
            if (e) e.preventDefault();
            if (!running) { running = true; return; }
            jump();
        };
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space' || e.key === 'ArrowUp') { e.preventDefault(); doJump(); }
            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
        });
        canvas.addEventListener('click', doJump);
        canvas.addEventListener('touchstart', doJump, { passive: false });

        document.addEventListener('visibilitychange', () => { if (document.hidden && running && !paused && !gameOver) togglePause(); });

        resetGame();
        lastTime = 0;
        animId = requestAnimationFrame(loop);

        window.__dino = { resetGame, jump, togglePause, get state() { return { score, highScore, speed, running, paused, gameOver }; } };
    })();
    </script>
    <script src="_interface.js"></script>
    <script src="_postgame.js"></script>
    <script src="_online.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js').catch(function(err) { console.warn('SW error:', err); });
    }
    </script>
</html>
