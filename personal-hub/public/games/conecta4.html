<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('ph.theme');if(t){if(t==='auto'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Conecta 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_theme.css">
    <link rel="stylesheet" href="_game-ui.css">
    <link rel="manifest" href="../manifest.json">
    <style>
        /* Conecta 4: tablero protagonista, HUD compacto, turno visible, móvil edge-to-edge */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .game-container {
            width: min(100%, 720px);
            padding: 18px 24px 34px;
        }

        .game-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-areas: "copy toolbar" "subtitle subtitle";
            align-items: center;
            gap: 4px 14px;
            margin: 0 auto 15px;
            text-align: left;
        }

        .game-header h1 {
            grid-area: copy;
            font-size: clamp(1.45rem, 2.8vw, 1.9rem);
            line-height: 1.05;
        }

        .game-header .subtitle {
            grid-area: subtitle;
            width: auto;
            margin: 0;
            text-align: left;
            font-size: 0.72rem;
        }

        .game-header__emoji {
            display: none;
        }

        .toolbar {
            grid-area: toolbar;
            justify-self: end;
        }

        .icon-btn {
            width: auto;
            min-width: 42px;
            min-height: 42px;
            padding: 0 13px;
            border-radius: 13px;
            font-family: var(--font-body);
            font-size: 0.72rem;
            font-weight: 700;
        }

        .score-display {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            width: min(100%, 520px);
            margin: 0 auto 12px;
        }

        .score-item {
            min-width: 0;
            padding: 9px 10px 8px;
            border-radius: 15px;
            background: linear-gradient(145deg, var(--surface-2), var(--panel));
            box-shadow: var(--elev-1);
        }

        .score-item .label {
            display: block;
            margin-bottom: 2px;
            font-size: 0.5rem;
            letter-spacing: 0.1em;
        }

        .score-item .value {
            font-size: 1.18rem;
            line-height: 1.1;
        }

        .score-item .value.red { color: var(--red); }
        .score-item .value.yellow { color: var(--gold); }
        .score-item .value.white { color: var(--ink); }

        /* Chip de turno */
        .turn-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto 12px;
            padding: 6px 16px;
            border-radius: 999px;
            background: var(--surface-2);
            border: 1px solid var(--panel-border);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--ink-dim);
            box-shadow: var(--elev-1);
        }

        .turn-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .canvas-wrap {
            width: min(100%, 440px, calc((100dvh - 340px) * 7 / 6));
            max-width: 440px;
            padding: 6px;
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            background: linear-gradient(145deg, var(--surface-2), rgba(232, 115, 90, 0.07));
            box-shadow: var(--elev-3), 0 0 38px rgba(232, 115, 90, 0.1);
        }

        canvas {
            width: 100%;
            max-width: none;
            aspect-ratio: 7 / 6;
            border: 0;
            border-radius: 18px;
            outline: none;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
            touch-action: none;
            cursor: pointer;
        }

        .controls-hint {
            width: min(100%, 520px);
            margin: 10px auto 0;
            padding: 8px 12px;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            background: var(--panel);
            color: var(--ink-dim);
            font-size: 0.66rem;
            line-height: 1.45;
        }

        .actions {
            width: min(100%, 520px);
            margin: 12px auto 0;
        }

        .actions .btn-primary {
            min-width: 170px;
            min-height: 44px;
            font-size: 0.82rem;
        }

        @media (max-width: 600px) {
            .game-container {
                width: 100%;
                max-width: none;
                min-height: 100dvh;
                padding: max(14px, env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
            }

            .game-header {
                grid-template-columns: 1fr auto;
                margin-bottom: 10px;
                text-align: center;
            }

            .game-header h1 {
                grid-column: 1 / -1;
                font-size: 1.3rem;
            }

            .game-header .subtitle {
                text-align: center;
                font-size: 0.68rem;
            }

            .score-display {
                max-width: none;
                gap: 5px;
                margin-bottom: 10px;
            }

            .score-item {
                padding: 7px 4px 6px;
                border-radius: 13px;
            }

            .score-item .label {
                font-size: 0.42rem;
                letter-spacing: 0.05em;
            }

            .score-item .value {
                font-size: 0.95rem;
            }

            .turn-chip {
                margin: 0 auto 10px;
                font-size: 0.7rem;
            }

            .canvas-wrap {
                width: min(100%, calc((100dvh - 340px) * 7 / 6));
                max-width: none;
                padding: 5px;
                border-radius: 20px;
            }

            canvas {
                border-radius: 15px;
            }

            .controls-hint {
                margin: 8px auto 0;
                font-size: 0.63rem;
            }

            .actions {
                margin: 10px auto 0;
            }

            .actions .btn-primary {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Conecta 4</h1>
            <div class="toolbar">
                <button class="icon-btn" id="pauseBtn" title="Pausa" aria-label="Pausar">⏸️ Pausa</button>
            </div>
            <span class="subtitle">Dos jugadores · Une 4 fichas en línea</span>
        </div>

        <div class="score-display">
            <div class="score-item"><span class="label">🔴 J1</span><span class="value red" id="wins1Display">0</span></div>
            <div class="score-item"><span class="label">🟡 J2</span><span class="value yellow" id="wins2Display">0</span></div>
            <div class="score-item"><span class="label">🤝 Empates</span><span class="value white" id="drawsDisplay">0</span></div>
        </div>

        <div class="turn-chip" id="turnChip" aria-live="polite"><span class="turn-dot" id="turnDot"></span><span id="turnText">Turno del Jugador 1</span></div>

        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="420" height="360" tabindex="0" aria-label="Tablero de Conecta 4. Toca una columna para soltar tu ficha"></canvas>
        </div>

        <div class="controls-hint" aria-label="Controles">
            <span>Toca una columna para soltar la ficha · 1–7 en el teclado · Juegan alternando</span>
        </div>

        <div class="actions">
            <button class="btn-primary" id="resetBtn">🔄 Reiniciar</button>
        </div>
    </div>

    <div class="game-message" id="gameMessage">
        <div class="game-message-content">
            <div class="icon" id="msgIcon">🎉</div>
            <h2 id="msgTitle">¡Gana el Jugador 1!</h2>
            <p id="msgText"></p>
            <button class="btn-primary" id="msgBtn">Jugar otra vez</button>
        </div>
    </div>

    <script>
    (() => {
        'use strict';
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const COLS = 7, ROWS = 6;
        const W = 420, H = 360, R = 24, MARGIN = 12;

        let board, turn, over, paused, wins1, wins2, draws;
        const pauseBtn = document.getElementById('pauseBtn');
        wins1 = parseInt(localStorage.getItem('conecta4Wins1') || '0', 10);
        wins2 = parseInt(localStorage.getItem('conecta4Wins2') || '0', 10);
        draws = parseInt(localStorage.getItem('conecta4Draws') || '0', 10);

        function resetGame() {
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            turn = 1;
            over = false;
            paused = false;
            pauseBtn.textContent = '⏸️ Pausa';
            pauseBtn.setAttribute('aria-label', 'Pausar');
            document.getElementById('gameMessage').classList.remove('show');
            updateChip();
            draw();
        }

        function updateChip() {
            const dot = document.getElementById('turnDot');
            const text = document.getElementById('turnText');
            dot.style.background = turn === 1 ? '#ef4444' : '#facc15';
            if (paused) text.textContent = '⏸️ Pausa';
            else if (over) text.textContent = 'Partida terminada';
            else text.textContent = turn === 1 ? 'Turno del Jugador 1' : 'Turno del Jugador 2';
        }

        function colX(c) { return MARGIN + R + c * ((W - 2 * MARGIN) / COLS); }
        function rowY(r) { return MARGIN + R + r * ((H - 2 * MARGIN) / ROWS); }

        function drop(col) {
            if (over || paused) return false;
            if (board[0][col]) { SFX.click(); return false; }
            let row = ROWS - 1;
            while (row >= 0 && board[row][col]) row--;
            board[row][col] = turn;
            SFX.point();
            buzz(10);
            draw();
            if (checkWin(row, col)) {
                over = true;
                if (turn === 1) { wins1++; localStorage.setItem('conecta4Wins1', wins1); } else { wins2++; localStorage.setItem('conecta4Wins2', wins2); }
                SFX.win();
                buzz([30, 20, 30, 20, 60]);
                document.getElementById(`wins${turn}Display`).textContent = turn === 1 ? wins1 : wins2;
                updateChip();
                showMessage('🎉', `¡Gana el Jugador ${turn}!`, `Jugador 1: ${wins1} · Jugador 2: ${wins2} · Empates: ${draws}`);
            } else if (board.every(r => r.every(c => c))) {
                over = true;
                draws++; localStorage.setItem('conecta4Draws', draws);
                document.getElementById('drawsDisplay').textContent = draws;
                updateChip();
                showMessage('🤝', '¡Empate!', `Jugador 1: ${wins1} · Jugador 2: ${wins2} · Empates: ${draws}`);
            } else {
                turn = turn === 1 ? 2 : 1;
                updateChip();
            }
            return true;
        }

        function checkWin(row, col) {
            const p = board[row][col];
            const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
            for (const [dr, dc] of dirs) {
                let count = 1;
                for (const s of [1, -1]) {
                    let r = row + dr * s, c = col + dc * s;
                    while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === p) { count++; r += dr * s; c += dc * s; }
                }
                if (count >= 4) return true;
            }
            return false;
        }

        function showMessage(icon, title, text) {
            document.getElementById('msgIcon').textContent = icon;
            document.getElementById('msgTitle').textContent = title;
            document.getElementById('msgText').textContent = text;
            document.getElementById('msgBtn').textContent = 'Jugar otra vez';
            document.getElementById('gameMessage').classList.add('show');
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-deep') || '#0a0a0c';
            ctx.fillRect(0, 0, W, H);
            const cellW = (W - 2 * MARGIN) / COLS, cellH = (H - 2 * MARGIN) / ROWS;
            // agujeros
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                const x = MARGIN + cellW / 2 + c * cellW, y = MARGIN + cellH / 2 + r * cellH;
                ctx.beginPath();
                ctx.arc(x, y, R - 3, 0, Math.PI * 2);
                ctx.fillStyle = board[r][c] === 1 ? '#ef4444' : board[r][c] === 2 ? '#facc15' : 'rgba(255,255,255,0.07)';
                ctx.fill();
                if (!board[r][c]) { ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1; ctx.stroke(); }
            }
            // indicador de columna (turno)
            ctx.fillStyle = turn === 1 ? 'rgba(239,68,68,0.25)' : 'rgba(250,204,21,0.25)';
            ctx.fillRect(0, 0, W, 4);

            // Overlay de pausa
            if (paused && !over) {
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.font = '700 26px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏸️ Pausa', W / 2, H / 2);
            }
        }

        function canvasToCol(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * W;
            return Math.max(0, Math.min(COLS - 1, Math.floor((x - MARGIN) / ((W - 2 * MARGIN) / COLS))));
        }

        canvas.addEventListener('click', (e) => { const col = canvasToCol(e); if (col >= 0 && col < COLS) drop(col); });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = (t.clientX - rect.left) / rect.width * W;
            const col = Math.max(0, Math.min(COLS - 1, Math.floor((x - MARGIN) / ((W - 2 * MARGIN) / COLS))));
            drop(col);
        }, { passive: false });

        function togglePause() {
            if (over) return;
            paused = !paused;
            pauseBtn.textContent = paused ? '▶️ Reanudar' : '⏸️ Pausa';
            pauseBtn.setAttribute('aria-label', paused ? 'Reanudar' : 'Pausar');
            pauseBtn.title = paused ? 'Reanudar' : 'Pausar';
            SFX.pause();
            updateChip();
            draw();
        }

        document.getElementById('msgBtn').addEventListener('click', () => { document.getElementById('gameMessage').classList.remove('show'); resetGame(); });
        pauseBtn.addEventListener('click', togglePause);
        document.getElementById('resetBtn').addEventListener('click', () => { resetGame(); SFX.click(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') resetGame();
            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
            if (e.key >= '1' && e.key <= '7') { const c = parseInt(e.key, 10) - 1; drop(c); }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && !over && !paused) togglePause();
        });

        document.getElementById('wins1Display').textContent = wins1;
        document.getElementById('wins2Display').textContent = wins2;
        document.getElementById('drawsDisplay').textContent = draws;

        resetGame();

        window.__conecta4 = { drop, resetGame, togglePause, get state() { return { turn, over, paused, wins1, wins2, draws }; } };
    })();
    </script>
    <script src="_interface.js"></script>
    <script src="_postgame.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js').catch(function(err) { console.warn('SW error:', err); });
    }
    </script>
</html>
