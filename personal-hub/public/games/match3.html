<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('ph.theme');if(t){if(t==='auto'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Match-3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_theme.css">
    <link rel="stylesheet" href="_game-ui.css">
    <link rel="manifest" href="../manifest.json">
    <style>
        /* Match-3: tablero cuadrado protagonista, HUD compacto, móvil edge-to-edge */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .game-container {
            width: min(100%, 640px);
            padding: 18px 24px 34px;
        }

        .game-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-areas: "copy toolbar" "subtitle subtitle";
            align-items: center;
            gap: 4px 14px;
            margin: 0 auto 15px;
            text-align: left;
        }

        .game-header h1 {
            grid-area: copy;
            font-size: clamp(1.45rem, 2.8vw, 1.9rem);
            line-height: 1.05;
        }

        .game-header .subtitle {
            grid-area: subtitle;
            width: auto;
            margin: 0;
            text-align: left;
            font-size: 0.72rem;
        }

        .game-header__emoji {
            display: none;
        }

        .toolbar {
            grid-area: toolbar;
            justify-self: end;
        }

        .icon-btn {
            width: auto;
            min-width: 42px;
            min-height: 42px;
            padding: 0 13px;
            border-radius: 13px;
            font-family: var(--font-body);
            font-size: 0.72rem;
            font-weight: 700;
        }

        .score-display {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            width: min(100%, 520px);
            margin: 0 auto 14px;
        }

        .score-item {
            min-width: 0;
            padding: 9px 10px 8px;
            border-radius: 15px;
            background: linear-gradient(145deg, var(--surface-2), var(--panel));
            box-shadow: var(--elev-1);
        }

        .score-item .label {
            display: block;
            margin-bottom: 2px;
            font-size: 0.5rem;
            letter-spacing: 0.1em;
        }

        .score-item .value {
            font-size: 1.18rem;
            line-height: 1.1;
        }

        .canvas-wrap {
            width: min(100%, 440px, calc(100dvh - 330px));
            max-width: 440px;
            padding: 6px;
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            background: linear-gradient(145deg, var(--surface-2), rgba(96, 165, 250, 0.07));
            box-shadow: var(--elev-3), 0 0 38px rgba(96, 165, 250, 0.1);
        }

        canvas {
            width: 100%;
            max-width: none;
            aspect-ratio: 1 / 1;
            border: 0;
            border-radius: 18px;
            outline: none;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
            cursor: pointer;
            touch-action: manipulation;
        }

        .controls-hint {
            width: min(100%, 520px);
            margin: 10px auto 0;
            padding: 8px 12px;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            background: var(--panel);
            color: var(--ink-dim);
            font-size: 0.66rem;
            line-height: 1.45;
        }

        @media (max-width: 600px) {
            .game-container {
                width: 100%;
                max-width: none;
                min-height: 100dvh;
                padding: max(14px, env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
            }

            .game-header {
                grid-template-columns: 1fr auto;
                margin-bottom: 10px;
                text-align: center;
            }

            .game-header h1 {
                grid-column: 1 / -1;
                font-size: 1.3rem;
            }

            .game-header .subtitle {
                text-align: center;
                font-size: 0.68rem;
            }

            .score-display {
                max-width: none;
                gap: 5px;
                margin-bottom: 10px;
            }

            .score-item {
                padding: 7px 4px 6px;
                border-radius: 13px;
            }

            .score-item .label {
                font-size: 0.42rem;
                letter-spacing: 0.05em;
            }

            .score-item .value {
                font-size: 0.95rem;
            }

            .canvas-wrap {
                width: min(100%, calc(100dvh - 330px));
                max-width: none;
                padding: 5px;
                border-radius: 20px;
            }

            canvas {
                border-radius: 15px;
            }

            .controls-hint {
                margin: 8px auto 0;
                font-size: 0.63rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Match-3</h1>
            <div class="toolbar">
                <button class="icon-btn" id="resetBtn" title="Reiniciar (R)" aria-label="Reiniciar partida">🔄 Reiniciar</button>
            </div>
            <span class="subtitle">Une 3 gemas en línea · Hacer líneas suma</span>
        </div>

        <div class="score-display">
            <div class="score-item"><span class="label">Puntos</span><span class="value gold" id="scoreDisplay">0</span></div>
            <div class="score-item"><span class="label">Récord</span><span class="value green" id="highScoreDisplay">0</span></div>
            <div class="score-item"><span class="label">Racha</span><span class="value red" id="comboDisplay">0</span></div>
        </div>

        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="440" height="440" tabindex="0" aria-label="Match-3. Toca una gema y luego otra para intercambiarlas"></canvas>
        </div>

        <div class="controls-hint" aria-label="Controles">
            <span>Clic en una gema y luego en otra para intercambiar · Flechas + Espacio · R reiniciar</span>
        </div>
    </div>

    <div class="game-message" id="gameMessage">
        <div class="game-message-content">
            <div class="icon" id="msgIcon">💀</div>
            <h2 id="msgTitle">Sin movimientos</h2>
            <p id="msgText">Puntuación: 0 · Récord: 0</p>
            <button class="btn-primary" id="msgBtn">Jugar otra vez</button>
        </div>
    </div>

    <script>
    (() => {
        'use strict';
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const N = 8, S = 440, PAD = 10;
        const CELL = (S - PAD * 2) / N;

        const TYPES = 5;
        const GEM_COLORS = ['#f87171', '#fb923c', '#facc15', '#4ade80', '#60a5fa'];

        let grid, score, highScore, combo, selected, busy, over, animId;

        highScore = parseInt(localStorage.getItem('match3HighScore') || '0', 10);
        document.getElementById('highScoreDisplay').textContent = highScore;

        function newGrid() {
            grid = Array.from({ length: N }, () => Array(N).fill(0));
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
                do { grid[r][c] = Math.floor(Math.random() * TYPES); }
                while (hasMatchAt(r, c));
            }
        }

        function hasMatchAt(r, c) {
            const v = grid[r][c];
            if (v === null) return false;
            // horizontal
            if (c >= 2 && grid[r][c - 1] === v && grid[r][c - 2] === v) return true;
            // vertical
            if (r >= 2 && grid[r - 1][c] === v && grid[r - 2][c] === v) return true;
            return false;
        }

        function findMatches() {
            const cells = new Set();
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    const v = grid[r][c];
                    if (v === null) continue;
                    // horizontal run
                    let len = 1;
                    while (c + len < N && grid[r][c + len] === v) len++;
                    if (len >= 3) for (let i = 0; i < len; i++) cells.add(r * N + (c + i));
                    // vertical run
                    len = 1;
                    while (r + len < N && grid[r + len][c] === v) len++;
                    if (len >= 3) for (let i = 0; i < len; i++) cells.add((r + i) * N + c);
                }
            }
            return [...cells];
        }

        function resetGame() {
            newGrid();
            score = 0;
            combo = 0;
            selected = null;
            busy = false;
            over = false;
            document.getElementById('gameMessage').classList.remove('show');
            updateUI();
            draw();
        }

        function swap(r1, c1, r2, c2) {
            [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
        }

        async function trySwap(r1, c1, r2, c2) {
            if (busy || over) return;
            if (r1 < 0 || r2 < 0 || c1 < 0 || c2 < 0) return;
            if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return;
            swap(r1, c1, r2, c2);
            if (findMatches().length === 0) {
                swap(r1, c1, r2, c2); // deshacer
                SFX.click();
                draw();
                return;
            }
            busy = true;
            selected = null;
            SFX.point();
            let comboTier = 0;
            while (true) {
                const matches = findMatches();
                if (!matches.length) break;
                comboTier++;
                combo = comboTier;
                document.getElementById('comboDisplay').textContent = combo;
                score += matches.length * 10 * comboTier;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('match3HighScore', highScore);
                    SFX.record();
                }
                updateUI();
                SFX.point();
                buzz(8);
                for (const idx of matches) grid[Math.floor(idx / N)][idx % N] = null;
                await sleep(90);
                applyGravity();
                refill();
                draw();
                await sleep(90);
            }
            combo = 0;
            document.getElementById('comboDisplay').textContent = '0';
            if (!hasValidMoves()) {
                over = true;
                SFX.lose();
                buzz([60, 40, 60]);
                const record = score > 0 && score >= highScore;
                showMessage(record ? '🏆' : '💀', record ? '¡Nuevo récord!' : 'Sin movimientos', `Puntuación: ${score} · Récord: ${highScore}`);
            }
            busy = false;
        }

        function applyGravity() {
            for (let c = 0; c < N; c++) {
                const col = [];
                for (let r = N - 1; r >= 0; r--) if (grid[r][c] !== null) col.push(grid[r][c]);
                for (let r = N - 1; r >= 0; r--) grid[r][c] = col[N - 1 - r] ?? null;
            }
        }

        function refill() {
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
                if (grid[r][c] === null) grid[r][c] = Math.floor(Math.random() * TYPES);
            }
        }

        function hasValidMoves() {
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
                if (c + 1 < N) {
                    swap(r, c, r, c + 1);
                    const ok = findMatches().length > 0;
                    swap(r, c, r, c + 1);
                    if (ok) return true;
                }
                if (r + 1 < N) {
                    swap(r, c, r + 1, c);
                    const ok = findMatches().length > 0;
                    swap(r, c, r + 1, c);
                    if (ok) return true;
                }
            }
            return false;
        }

        const sleep = (ms) => new Promise(res => setTimeout(res, ms));

        function showMessage(icon, title, text) {
            document.getElementById('msgIcon').textContent = icon;
            document.getElementById('msgTitle').textContent = title;
            document.getElementById('msgText').textContent = text;
            document.getElementById('msgBtn').textContent = 'Jugar otra vez';
            document.getElementById('gameMessage').classList.add('show');
        }

        function updateUI() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('highScoreDisplay').textContent = highScore;
            document.getElementById('comboDisplay').textContent = combo;
        }

        function draw() {
            ctx.clearRect(0, 0, S, S);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-deep') || '#0a0a0c';
            ctx.fillRect(0, 0, S, S);
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
                const x = PAD + c * CELL, y = PAD + r * CELL;
                ctx.fillStyle = 'rgba(255,255,255,0.04)';
                ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
                if (grid[r][c] !== null) drawGem(x + CELL / 2, y + CELL / 2, CELL * 0.38, grid[r][c], selected && selected.r === r && selected.c === c);
            }
        }

        function drawGem(x, y, r, type, isSel) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = GEM_COLORS[type];
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.beginPath();
            ctx.arc(x - r * 0.28, y - r * 0.28, r * 0.35, 0, Math.PI * 2);
            ctx.fill();
            if (isSel) {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(x, y, r + 4, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function posToCell(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * S;
            const y = (e.clientY - rect.top) / rect.height * S;
            const c = Math.floor((x - PAD) / CELL), r = Math.floor((y - PAD) / CELL);
            if (r < 0 || r >= N || c < 0 || c >= N) return null;
            return { r, c };
        }

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const pos = posToCell(e);
            if (!pos) return;
            if (!selected) { selected = pos; draw(); return; }
            const prev = selected;
            selected = null;
            if (prev.r === pos.r && prev.c === pos.c) { draw(); return; }
            trySwap(prev.r, prev.c, pos.r, pos.c);
        });

        document.getElementById('msgBtn').addEventListener('click', () => { document.getElementById('gameMessage').classList.remove('show'); resetGame(); });
        document.getElementById('resetBtn').addEventListener('click', resetGame);

        // teclado: cursor + espacio para intercambiar
        let cur = { r: 0, c: 0 };
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') { resetGame(); return; }
            if (busy || over) return;
            const move = (dr, dc) => { cur.r = Math.max(0, Math.min(N - 1, cur.r + dr)); cur.c = Math.max(0, Math.min(N - 1, cur.c + dc)); draw(); };
            if (e.key === 'ArrowUp') move(-1, 0);
            else if (e.key === 'ArrowDown') move(1, 0);
            else if (e.key === 'ArrowLeft') move(0, -1);
            else if (e.key === 'ArrowRight') move(0, 1);
            else if (e.key === ' ' || e.key === 'Space') {
                if (!selected) { selected = { r: cur.r, c: cur.c }; }
                else {
                    const prev = selected;
                    selected = null;
                    if (prev.r !== cur.r || prev.c !== cur.c) trySwap(prev.r, prev.c, cur.r, cur.c);
                }
                draw();
            }
        });

        document.addEventListener('visibilitychange', () => { if (document.hidden && !over) resetGame(); });

        resetGame();

        window.__match3 = { resetGame, trySwap, get state() { return { score, highScore, combo, over, busy }; } };
    })();
    </script>
    <script src="_interface.js"></script>
    <script src="_postgame.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js').catch(function(err) { console.warn('SW error:', err); });
    }
    </script>
</html>
