<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('ph.theme');if(t){if(t==='auto'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_theme.css">
    <link rel="stylesheet" href="_game-ui.css">
    <link rel="manifest" href="../manifest.json">
    <style>
        /* 2048: el tablero es el protagonista, HUD compacto, móvil edge-to-edge */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .game-container {
            width: min(100%, 720px);
            padding: 18px 24px 34px;
        }

        .game-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-areas: "copy toolbar" "subtitle subtitle";
            align-items: center;
            gap: 4px 14px;
            margin: 0 auto 15px;
            text-align: left;
        }

        .game-header h1 {
            grid-area: copy;
            font-size: clamp(1.45rem, 2.8vw, 1.9rem);
            line-height: 1.05;
        }

        .game-header .subtitle {
            grid-area: subtitle;
            width: auto;
            margin: 0;
            text-align: left;
            font-size: 0.72rem;
        }

        .game-header__emoji {
            display: none;
        }

        .toolbar {
            grid-area: toolbar;
            justify-self: end;
        }

        .icon-btn {
            width: auto;
            min-width: 42px;
            min-height: 42px;
            padding: 0 13px;
            border-radius: 13px;
            font-family: var(--font-body);
            font-size: 0.72rem;
            font-weight: 700;
        }

        .icon-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .score-display {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            width: min(100%, 520px);
            margin: 0 auto 14px;
        }

        .score-item {
            min-width: 0;
            padding: 9px 10px 8px;
            border-radius: 15px;
            background: linear-gradient(145deg, var(--surface-2), var(--panel));
            box-shadow: var(--elev-1);
        }

        .score-item .label {
            display: block;
            margin-bottom: 2px;
            font-size: 0.5rem;
            letter-spacing: 0.1em;
        }

        .score-item .value {
            font-size: 1.18rem;
            line-height: 1.1;
        }

        /* Selector de tamaño: centrado bajo el HUD */
        .size-control {
            display: inline-flex;
            margin: 0 auto 12px;
        }

        .canvas-wrap {
            width: min(100%, 420px, calc(100dvh - 330px));
            max-width: 420px;
            padding: 6px;
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            background: linear-gradient(145deg, var(--surface-2), rgba(232, 115, 90, 0.07));
            box-shadow: var(--elev-3), 0 0 38px rgba(232, 115, 90, 0.1);
        }

        canvas {
            width: 100%;
            max-width: none;
            aspect-ratio: 1 / 1;
            border: 0;
            border-radius: 18px;
            outline: none;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
            touch-action: none;
        }

        .controls-hint {
            width: min(100%, 520px);
            margin: 10px auto 0;
            padding: 8px 12px;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            background: var(--panel);
            color: var(--ink-dim);
            font-size: 0.66rem;
            line-height: 1.45;
        }

        .mobile-hint { display: none; }

        .actions {
            width: min(100%, 520px);
            margin: 12px auto 0;
        }

        .actions .btn-primary {
            min-width: 170px;
            min-height: 44px;
            font-size: 0.82rem;
        }

        @media (max-width: 600px) {
            .game-container {
                width: 100%;
                max-width: none;
                min-height: 100dvh;
                padding: max(14px, env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
            }

            .game-header {
                grid-template-columns: 1fr auto;
                margin-bottom: 10px;
                text-align: center;
            }

            .game-header h1 {
                grid-column: 1 / -1;
                font-size: 1.3rem;
            }

            .game-header .subtitle {
                text-align: center;
                font-size: 0.68rem;
            }

            .score-display {
                max-width: none;
                gap: 5px;
                margin-bottom: 10px;
            }

            .score-item {
                padding: 7px 4px 6px;
                border-radius: 13px;
            }

            .score-item .label {
                font-size: 0.42rem;
                letter-spacing: 0.05em;
            }

            .score-item .value {
                font-size: 0.95rem;
            }

            .size-control {
                margin: 0 auto 10px;
            }

            .canvas-wrap {
                width: min(100%, calc(100dvh - 350px));
                max-width: none;
                padding: 5px;
                border-radius: 20px;
            }

            canvas {
                border-radius: 15px;
            }

            .controls-hint {
                margin: 8px auto 0;
                font-size: 0.63rem;
            }

            .desktop-hint { display: none; }
            .mobile-hint { display: inline; }

            .actions {
                margin: 10px auto 0;
            }

            .actions .btn-primary {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>2048</h1>
            <div class="toolbar">
                <button class="icon-btn" id="pauseBtn" title="Pausa" aria-label="Pausar">⏸️ Pausa</button>
            </div>
            <span class="subtitle">Fusiona las baldosas hasta llegar a 2048</span>
        </div>

        <div class="score-display">
            <div class="score-item"><span class="label">Puntuación</span><span class="value gold" id="scoreDisplay">0</span></div>
            <div class="score-item"><span class="label">Récord</span><span class="value green" id="highScoreDisplay">0</span></div>
            <div class="score-item"><span class="label">Mayor</span><span class="value red" id="bestTileDisplay">2</span></div>
        </div>

        <!-- ===== TAMAÑO DEL TABLERO ===== -->
        <div class="size-control" aria-label="Tamaño del tablero">
            <button class="size-btn active" data-size="4">4×4</button>
            <button class="size-btn" data-size="5">5×5</button>
            <button class="size-btn" data-size="6">6×6</button>
        </div>

        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="420" height="420" tabindex="0" aria-label="Tablero de 2048. Flechas o desliza para mover las fichas"></canvas>
        </div>

        <div class="controls-hint" aria-label="Controles">
            <span class="desktop-hint">Flechas / WASD · P pausa · R nueva partida</span>
            <span class="mobile-hint">Desliza para mover · P pausa · R nueva partida</span>
        </div>

        <div class="actions">
            <button class="btn-primary" id="resetBtn">🔄 Reiniciar</button>
        </div>
    </div>

    <div class="game-message" id="gameMessage">
        <div class="game-message-content">
            <div class="icon" id="msgIcon">💀</div>
            <h2 id="msgTitle">¡Fin de la partida!</h2>
            <p id="msgText">Puntuación: 0 · Mayor: 2 · Récord: 0</p>
            <button class="btn-primary" id="msgBtn">Jugar otra vez</button>
        </div>
    </div>

    <script>
    (() => {
        'use strict';
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GAP = 12, PAD = 14;

        // --- Tamaños del tablero (4×4 clásico, 5×5, 6×6) ---
        const SIZES = {
            '4': { n: 4, s: 420 },
            '5': { n: 5, s: 500 },
            '6': { n: 6, s: 580 }
        };
        let sizePref = SIZES[localStorage.getItem('game2048Size')] ? localStorage.getItem('game2048Size') : '4';
        let N, S, CELL;

        function applyBoard() {
            const cfg = SIZES[sizePref];
            N = cfg.n; S = cfg.s;
            CELL = (S - PAD * 2 - GAP * (N - 1)) / N;
            canvas.width = S;
            canvas.height = S;
        }

        let grid, score, best, over, won, paused;

        const pauseBtn = document.getElementById('pauseBtn');

        best = parseInt(localStorage.getItem('game2048Best') || '0', 10);
        document.getElementById('highScoreDisplay').textContent = best;

        const COLORS = {
            2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f',
            64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850',
            1024: '#edc53f', 2048: '#edc22e'
        };
        const TEXT = v => (v <= 4 ? '#776e65' : '#f9f6f2');

        function emptyCells() {
            const out = [];
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) out.push([r, c]);
            return out;
        }

        function addTile() {
            const empty = emptyCells();
            if (!empty.length) return;
            const [r, c] = empty[Math.floor(Math.random() * empty.length)];
            grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        }

        function resetGame() {
            applyBoard();
            grid = Array.from({ length: N }, () => Array(N).fill(0));
            score = 0; over = false; won = false; paused = false;
            pauseBtn.textContent = '⏸️ Pausa';
            pauseBtn.setAttribute('aria-label', 'Pausar');
            pauseBtn.disabled = false;
            addTile(); addTile();
            document.getElementById('gameMessage').classList.remove('show');
            updateUI();
            draw();
        }

        // --- Deslizar una fila hacia la izquierda (lógica pura) ---
        function slideRow(row) {
            const vals = row.filter(v => v);
            const out = [];
            let gained = 0;
            for (let i = 0; i < vals.length; i++) {
                if (vals[i] === vals[i + 1]) { out.push(vals[i] * 2); gained += vals[i] * 2; i++; }
                else out.push(vals[i]);
            }
            while (out.length < N) out.push(0);
            return { row: out, gained };
        }

        function move(dir) {
            if (over || paused) return false;
            const before = JSON.stringify(grid);
            let gained = 0;
            // dir: 0 izq, 1 der, 2 arr, 3 ab
            // Arriba/Abajo: transponer (cada columna pasa a ser fila),
            // deslizar y deshacer la transposición. Evita la rotación que
            // empujaba las fichas en dirección contraria.
            const transpose = (g) => {
                const o = Array.from({ length: N }, () => Array(N).fill(0));
                for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) o[c][r] = g[r][c];
                return o;
            };
            let g = grid;
            if (dir === 1) g = g.map(r => r.slice().reverse());
            else if (dir === 2 || dir === 3) {
                g = transpose(g);
                if (dir === 3) g = g.map(r => r.slice().reverse());
            }

            let ng = [];
            for (const row of g) {
                const res = slideRow(row);
                ng.push(res.row);
                gained += res.gained;
            }

            let ng2 = ng;
            if (dir === 1) ng2 = ng.map(r => r.slice().reverse());
            else if (dir === 2 || dir === 3) {
                if (dir === 3) ng = ng.map(r => r.slice().reverse());
                ng2 = transpose(ng);
            }

            grid = ng2;
            if (JSON.stringify(grid) === before) {
                // Sin movimiento posible: si además no quedan jugadas, la partida termina.
                if (!movesLeft()) gameEnd();
                return false;
            }
            if (gained > 0) {
                score += gained;
                if (score > best) { best = score; localStorage.setItem('game2048Best', best); }
                SFX.point();
                buzz(8);
            }
            addTile();
            updateUI();
            draw();
            if (hasWon() && !won) { won = true; SFX.win(); }
            if (!movesLeft()) gameEnd();
            return true;
        }

        function hasWon() { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] === 2048) return true; return false; }

        function movesLeft() {
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
                if (!grid[r][c]) return true;
                if (c + 1 < N && grid[r][c] === grid[r][c + 1]) return true;
                if (r + 1 < N && grid[r][c] === grid[r + 1][c]) return true;
            }
            return false;
        }

        function gameEnd() {
            over = true;
            pauseBtn.disabled = true;
            SFX.lose();
            buzz([60, 40, 60]);
            const prevBest = parseInt(localStorage.getItem('game2048Best') || '0', 10);
            const newRecord = score > 0 && score >= prevBest;
            showMessage(newRecord ? '🏆' : '💀', newRecord ? '¡Nuevo récord!' : '¡Fin de la partida!', `Puntuación: ${score} · Mayor: ${maxTile()} · Récord: ${best}`);
        }

        function maxTile() { let m = 0; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) m = Math.max(m, grid[r][c]); return m; }

        function showMessage(icon, title, text) {
            document.getElementById('msgIcon').textContent = icon;
            document.getElementById('msgTitle').textContent = title;
            document.getElementById('msgText').textContent = text;
            document.getElementById('msgBtn').textContent = 'Jugar otra vez';
            document.getElementById('gameMessage').classList.add('show');
        }

        function updateUI() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('highScoreDisplay').textContent = best;
            document.getElementById('bestTileDisplay').textContent = maxTile();
        }

        function draw() {
            ctx.clearRect(0, 0, S, S);            const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-deep') || '#0a0a0c';
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, S, S);
            // fondo del tablero
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            ctx.fillRect(0, 0, S, S);
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
                const x = PAD + c * (CELL + GAP), y = PAD + r * (CELL + GAP);
                const v = grid[r][c];
                ctx.fillStyle = v ? (COLORS[v] || '#edc22e') : 'rgba(255,255,255,0.06)';
                roundRect(x, y, CELL, CELL, 10);
                ctx.fill();
                if (v) {
                    ctx.fillStyle = TEXT(v);
                    ctx.font = `700 ${v >= 1024 ? Math.round(CELL * 0.30) : v >= 128 ? Math.round(CELL * 0.38) : Math.round(CELL * 0.5)}px Inter, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(v, x + CELL / 2, y + CELL / 2 + 1);
                }
            }

            // Overlay de pausa
            if (paused && !over) {
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, S, S);
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.font = '700 26px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏸️ Pausa', S / 2, S / 2);
            }
        }

        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function togglePause() {
            if (over) return;
            paused = !paused;
            pauseBtn.textContent = paused ? '▶️ Reanudar' : '⏸️ Pausa';
            pauseBtn.setAttribute('aria-label', paused ? 'Reanudar' : 'Pausar');
            pauseBtn.title = paused ? 'Reanudar' : 'Pausar';
            SFX.pause();
            draw();
        }

        pauseBtn.addEventListener('click', togglePause);
        document.getElementById('msgBtn').addEventListener('click', () => { document.getElementById('gameMessage').classList.remove('show'); resetGame(); });
        document.getElementById('resetBtn').addEventListener('click', () => { resetGame(); SFX.click(); });

        document.addEventListener('keydown', (e) => {
            const k = e.key;
            if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(k)) e.preventDefault();
            if (k === 'r' || k === 'R') { resetGame(); return; }
            if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); return; }
            if (paused || over) return;
            if (k === 'ArrowLeft' || k === 'a' || k === 'A') move(0);
            else if (k === 'ArrowRight' || k === 'd' || k === 'D') move(1);
            else if (k === 'ArrowUp' || k === 'w' || k === 'W') move(2);
            else if (k === 'ArrowDown' || k === 's' || k === 'S') move(3);
        });

        let tx = 0, ty = 0, tActive = false;
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.touches[0]; tx = t.clientX; ty = t.clientY; tActive = true; }, { passive: false });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!tActive) return;
            const t = e.changedTouches[0];
            const dx = t.clientX - tx, dy = t.clientY - ty;
            if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) {
                if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 0);
                else move(dy > 0 ? 3 : 2);
            }
            tActive = false;
        }, { passive: false });

        document.addEventListener('visibilitychange', () => { if (document.hidden && !over && !paused) togglePause(); });

        // --- Selector de tamaño ---
        function applySizeUI() {
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.size === sizePref);
            });
        }
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                sizePref = btn.dataset.size;
                localStorage.setItem('game2048Size', sizePref);
                applySizeUI();
                resetGame();
                SFX.click();
            });
        });
        applySizeUI();

        resetGame();

        window.__2048 = { move, resetGame, togglePause, get state() { return { score, best, over, paused, grid, size: sizePref, n: N }; } };
    })();
    </script>
    <script src="_interface.js"></script>
    <script src="_postgame.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js').catch(function(err) { console.warn('SW error:', err); });
    }
    </script>
    <script src="_online.js"></script>
</html>
