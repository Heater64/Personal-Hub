<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('ph.theme');if(t){if(t==='auto'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Breakout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_theme.css">
    <link rel="stylesheet" href="_game-ui.css">
    <link rel="manifest" href="../manifest.json">
    <style>
        /* Breakout — tablero a ancho completo del dispositivo (16:10).
           El chrome (header, chips, modal, botones) lo estiliza _game-ui.css;
           estas reglas van después y solo ajustan lo específico del juego. */
        body {
            margin: 0;
        }

        .game-container {
            box-sizing: border-box;
            max-width: 1060px;
            padding-bottom: 24px;
            text-align: center;
        }

        .game-header {
            margin-bottom: 16px;
        }

        .game-header__emoji {
            width: 54px;
            height: 54px;
            font-size: 1.55rem;
            border-radius: 16px;
            margin-bottom: 6px;
        }

        .game-header h1 {
            font-size: 1.6rem;
            line-height: 1.1;
        }

        .game-header .subtitle {
            margin: 4px 0 0;
            font-size: 0.72rem;
        }
        canvas {
            display: block;
            width: 100%;
            max-width: 1000px;
            height: auto;
            margin: 0 auto;
            background: #0a0a12;
            border-radius: 20px;
            touch-action: none;
        }
        .score-display {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            width: 100%;
            max-width: 520px;
            margin: 0 auto 14px;
        }

        .score-display .stat {
            min-width: 0;
            padding: 8px 10px;
            text-align: center;
        }

        .score-display .stat-label {
            font-size: 0.52rem;
        }

        .score-display .stat-value {
            font-size: 1rem;
        }
        .size-control {
            display: flex;
            flex-wrap: nowrap;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto 16px;
            padding: 4px;
            border-radius: 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .size-control::-webkit-scrollbar { display: none; }

        .size-btn {
            min-width: 104px;
            padding: 8px 12px;
            border-radius: 9px;
            white-space: nowrap;
        }

        .game-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .game-actions .btn-ghost {
            min-width: 132px;
            min-height: 42px;
            padding: 10px 16px;
            border-radius: 12px;
            font-family: var(--font-body);
            font-weight: 600;
        }

        .game-actions .btn-ghost:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .controls-hint {
            margin: 10px 0 0;
            font-size: 0.72rem;
            line-height: 1.4;
        }

        @media (max-width: 600px) {
            body {
                min-height: 100dvh;
                margin: 0;
            }

            .game-container {
                box-sizing: border-box;
                width: 100%;
                max-width: none;
                min-height: 100dvh;
                padding: max(16px, env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));
            }

            .game-header {
                margin-bottom: 10px;
            }

            .game-header__emoji {
                display: none;
            }

            .game-header h1 {
                font-size: 1.35rem;
            }

            .game-header .subtitle {
                font-size: 0.68rem;
            }

            .score-display {
                gap: 5px;
                max-width: none;
            }

            .score-display .stat {
                padding: 7px 4px;
                border-radius: 11px;
            }

            .score-display .stat-label {
                font-size: 0.44rem;
                letter-spacing: 0.03em;
            }

            .score-display .stat-value {
                font-size: 0.9rem;
            }

            .size-control {
                display: flex;
                flex-wrap: nowrap;
                justify-content: flex-start;
                box-sizing: border-box;
                width: 100%;
                margin-bottom: 12px;
                overflow-x: auto;
            }

            .size-btn {
                flex: 0 0 auto;
                min-width: 104px;
            }

            .game-actions {
                width: 100%;
                margin-top: 10px;
            }

            .game-actions .btn-ghost {
                flex: 1;
                min-width: 0;
                min-height: 44px;
            }

            .controls-hint {
                font-size: 0.66rem;
                margin-top: 8px;
            }

            .game-back-nav { display: none; }
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Breakout</h1>
            <p class="subtitle">Mueve el mouse o toca la pantalla</p>
        </div>

        <div class="score-display">
            <div class="score-item"><div class="label">Puntuación</div><div class="value gold" id="scoreDisplay">0</div></div>
            <div class="score-item"><div class="label">Récord</div><div class="value green" id="highScoreDisplay">0</div></div>
            <div class="score-item"><div class="label">Vidas</div><div class="value" id="livesDisplay">❤️❤️❤️</div></div>
        </div>

        <!-- ===== TAMAÑO ===== -->
        <div class="size-control">
            <button class="size-btn" data-size="pequeno">Pequeño</button>
            <button class="size-btn active" data-size="mediano">Mediano</button>
            <button class="size-btn" data-size="grande">Grande</button>
            <button class="size-btn" data-size="extragrande">Extra grande</button>
            <button class="size-btn" data-size="super">Super</button>
        </div>

        <canvas id="gameCanvas" width="500" height="500"></canvas>

        <div class="controls-hint">← → o mouse/touch</div>

        <div class="game-actions">
            <button id="pauseBtn" class="btn-ghost" title="Pausar" aria-label="Pausar" disabled>⏸️ Pausa</button>
            <button id="resetBtn" class="btn-ghost">🔄 Reiniciar</button>
        </div>

        <div class="game-back-nav">
            <a href="/#/juegos" class="back-btn">← Juegos</a>
            <a href="/#/calendario" class="back-btn">← Calendario</a>
        </div>
    </div>

    <div class="game-message" id="gameMessage">
        <div class="game-message-content">
            <div class="icon" id="msgIcon">🏆</div>
            <h2 id="msgTitle">¡Has ganado!</h2>
            <p id="msgText">Has destruido todos los bloques.</p>
            <button class="btn-primary" id="msgBtn">Reintentar</button>
        </div>
    </div>

    <!-- Pantalla de inicio -->
    <div class="game-message" id="gameStart">
        <div class="game-message-content">
            <div class="icon">🧊</div>
            <h2>Breakout</h2>
            <p>Rompe todos los bloques. Mueve la paleta con ← →, el ratón o el dedo.</p>
            <button class="btn-primary" id="startBtn">▶ Jugar</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;

        let paddle, ball;
        let bricks = [];
        let score = 0, lives = 3;
        let gameRunning = true, animationId = null;
        let paused = false;
        let keys = {};

        const BRICK_H = 22, BRICK_GAP = 5;
        /* Resolución interna fija del tablero (16:10). El CSS lo escala al
           ancho completo del dispositivo, así que el juego usa estas
           coordenadas de forma constante en móvil y escritorio. */
        const BOARD_W = 1000, BOARD_H = 625;

        // --- Tamaños elegibles a mano (5 opciones) ---
        let sizePref = ['pequeno', 'mediano', 'grande', 'extragrande', 'super'].includes(localStorage.getItem('breakoutSize')) ? localStorage.getItem('breakoutSize') : 'mediano';
        const SIZES = {
            pequeno:    { rows: 4, cols: 8,  pts: 10, speed: 9.0,  label: 'Pequeño' },
            mediano:    { rows: 6, cols: 10, pts: 12, speed: 10.5, label: 'Mediano' },
            grande:     { rows: 7, cols: 12, pts: 14, speed: 12.0, label: 'Grande' },
            extragrande: { rows: 8, cols: 14, pts: 16, speed: 12.8, label: 'Extra grande' },
            super:      { rows: 9, cols: 16, pts: 18, speed: 13.5, label: 'Super' }
        };

        function getConfig() {
            return SIZES[sizePref];
        }

        // --- El tablero siempre ocupa el ancho completo (resolución fija) ---
        function applyBoard() {
            W = BOARD_W;
            H = BOARD_H;
            canvas.width = W;
            canvas.height = H;
            paddle = { x: W / 2 - 55, y: H - 26, w: 110, h: 12 };
            ball = { x: W / 2, y: H - 44, r: 7, dx: 5, dy: -5 };
        }

        function initBricks() {
            bricks = [];
            const cfg = getConfig();
            const ROWS = cfg.rows, COLS = cfg.cols;
            const BRICK_W = Math.floor((W - 24 - (COLS - 1) * BRICK_GAP) / COLS);
            const startX = (W - (COLS * BRICK_W + (COLS - 1) * BRICK_GAP)) / 2;
            const colors = ['#c65a3a', '#ffb347', '#ff8aa1', '#4caf50', '#2196f3', '#9c27b0', '#8b5cf6', '#e8735a', '#38bdf8'];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const x = startX + c * (BRICK_W + BRICK_GAP);
                    const y = r * (BRICK_H + BRICK_GAP) + 30;
                    bricks.push({
                        x, y, w: BRICK_W, h: BRICK_H,
                        color: colors[r % colors.length],
                        alive: true,
                        points: (ROWS - r) * cfg.pts
                    });
                }
            }
        }

        function resetBall() {
            const spd = getConfig().speed;
            ball.x = W/2;
            ball.y = H - 44;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * (spd * 0.75 + Math.random() * 0.8);
            ball.dy = -spd;
        }

        function update() {
            if (!gameRunning) return;

            if (!paused) {
            // Paddle movimiento
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= 15;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += 15;
            paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

            // Bola
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Paredes
            if (ball.x - ball.r < 0 || ball.x + ball.r > W) ball.dx *= -1;
            if (ball.y - ball.r < 0) ball.dy *= -1;

            // Paddle
            if (ball.dy > 0 &&
                ball.y + ball.r >= paddle.y &&
                ball.y + ball.r <= paddle.y + paddle.h + 5 &&
                ball.x >= paddle.x - ball.r &&
                ball.x <= paddle.x + paddle.w + ball.r) {
                const hitPos = (ball.x - paddle.x) / paddle.w;
                const angle = (hitPos - 0.5) * 1.2;
                const speed = Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy);
                ball.dx = Math.sin(angle) * speed;
                ball.dy = -Math.cos(angle) * speed;
                ball.y = paddle.y - ball.r;
            }

            // Bloques
            for (const brick of bricks) {
                if (!brick.alive) continue;
                if (ball.x + ball.r > brick.x &&
                    ball.x - ball.r < brick.x + brick.w &&
                    ball.y + ball.r > brick.y &&
                    ball.y - ball.r < brick.y + brick.h) {
                    brick.alive = false;
                    score += brick.points;
                    document.getElementById('scoreDisplay').textContent = score;
                    SFX.point();
                    buzz(8);

                    // Rebote
                    const overlapX = Math.min(ball.x + ball.r - brick.x, brick.x + brick.w - (ball.x - ball.r));
                    const overlapY = Math.min(ball.y + ball.r - brick.y, brick.y + brick.h - (ball.y - ball.r));
                    if (overlapX < overlapY) ball.dx *= -1;
                    else ball.dy *= -1;

                    // Verificar victoria
                    if (bricks.every(b => !b.alive)) {
                        completeLevel();
                        return;
                    }
                    break;
                }
            }

            // Caída
            if (ball.y + ball.r > H) {
                lives--;
                const hearts = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
                document.getElementById('livesDisplay').textContent = hearts || '💀';
                if (lives <= 0) {
                    gameRunning = false;
                    document.getElementById('pauseBtn').disabled = true;
                    checkRecord();
                    SFX.lose();
                    buzz([60, 40, 60]);
                    showMessage(recordBroken ? '🏆' : '💀', recordBroken ? '¡Nuevo récord!' : '¡Game Over!', `Puntuación: ${score} · Récord: ${highScore}`);
                    return;
                }
                resetBall();
                SFX.click();
            }
            }

            draw();
            animationId = requestAnimationFrame(update);
        }

        function togglePause() {
            if (!gameRunning) return;
            paused = !paused;
            const btn = document.getElementById('pauseBtn');
            btn.textContent = paused ? '▶️ Reanudar' : '⏸️ Pausa';
            btn.title = paused ? 'Reanudar' : 'Pausar';
            btn.setAttribute('aria-label', paused ? 'Reanudar' : 'Pausar');
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Bloques
            bricks.forEach(b => {
                if (!b.alive) return;
                ctx.shadowColor = 'rgba(198,90,58,0.15)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(b.x, b.y, b.w, b.h);
            });

            // Paddle
            ctx.shadowColor = 'rgba(198,90,58,0.3)';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#c65a3a';
            ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
            ctx.shadowBlur = 0;

            // Bola
            ctx.shadowColor = 'rgba(255,179,71,0.4)';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ffb347';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function showMessage(icon, title, text, btnText) {
            document.getElementById('msgIcon').textContent = icon;
            document.getElementById('msgTitle').textContent = title;
            document.getElementById('msgText').textContent = text;
            document.getElementById('msgBtn').textContent = btnText || 'Reintentar';
            document.getElementById('gameMessage').classList.add('show');
        }

        function hideMessage() {
            document.getElementById('gameMessage').classList.remove('show');
        }
            document.getElementById('msgBtn').addEventListener('click', () => {
                hideMessage();
                resetGame();
            });

        // --- Tablero completado (victoria) ---
        function completeLevel() {
            gameRunning = false;
            checkRecord();
            SFX.win();
            buzz(15);
            showMessage('🏆', '¡Has ganado!', `Puntuación: ${score} · Tamaño: ${getConfig().label} · Récord: ${highScore}`, 'Jugar de nuevo');
        }

        // --- Récord (localStorage) ---
        let highScore = parseInt(localStorage.getItem('breakoutHighScore') || '0', 10);
        let recordBroken = false;
        function checkRecord() {
            if (score > highScore) {
                highScore = score;
                recordBroken = true;
                localStorage.setItem('breakoutHighScore', highScore);
                SFX.record();
            }
        }
        document.getElementById('highScoreDisplay').textContent = highScore;

        function resetGame() {
            if (animationId) cancelAnimationFrame(animationId);
            score = 0;
            lives = 3;
            recordBroken = false;
            gameRunning = true;
            paused = false;
            const pauseBtnEl = document.getElementById('pauseBtn');
            if (pauseBtnEl) {
                pauseBtnEl.textContent = '⏸️ Pausa';
                pauseBtnEl.title = 'Pausar';
                pauseBtnEl.setAttribute('aria-label', 'Pausar');
                pauseBtnEl.disabled = false;
            }
            document.getElementById('scoreDisplay').textContent = '0';
            document.getElementById('livesDisplay').textContent = '❤️❤️❤️';
            paddle.x = W/2 - 50;
            initBricks();
            resetBall();
            draw();
            update();
        }

        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('startBtn').addEventListener('click', () => {
            if (gameRunning) return;
            document.getElementById('gameStart').classList.remove('show');
            gameRunning = true;
            paused = false;
            document.getElementById('pauseBtn').disabled = false;
            update();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'p' || e.key === 'P') togglePause();
        });

        // Auto-pausa al cambiar de pestaña/app (móvil)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && gameRunning && !paused) {
                paused = true;
                const btn = document.getElementById('pauseBtn');
                btn.textContent = '▶️ Reanudar';
                btn.title = 'Reanudar';
                btn.setAttribute('aria-label', 'Reanudar');
            }
        });

        // Mouse
        canvas.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * W;
            paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w/2));
        });

        // Touch
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = (touch.clientX - rect.left) / rect.width * W;
            paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w/2));
        }, { passive: false });

        document.addEventListener('keydown', (e) => { keys[e.key] = true; if (['ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault(); });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });

        applyBoard();
        initBricks();
        resetBall();
        draw();
        document.getElementById('highScoreDisplay').textContent = highScore;
        // Espera al botón "Jugar" antes de arrancar
        gameRunning = false;
        document.getElementById('pauseBtn').disabled = true;
        document.getElementById('gameStart').classList.add('show');

        window.resetGame = resetGame;
        // API de prueba
        window.__breakout = {
            get state() { return { size: sizePref, score, lives, alive: bricks.filter(b => b.alive).length, total: bricks.length, speed: getConfig().speed }; },
            completeLevel: completeLevel
        };

        // --- Selector de tamaño ---
        function applySizeUI() {
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.size === sizePref);
            });
        }
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                sizePref = btn.dataset.size;
                localStorage.setItem('breakoutSize', sizePref);
                applySizeUI();
                applyBoard();
                if (document.getElementById('gameStart').classList.contains('show')) {
                    // Todavía no ha empezado: solo preparar el tablero del nuevo tamaño
                    initBricks();
                    resetBall();
                    draw();
                } else {
                    resetGame();
                }
            });
        });
        applySizeUI();
    </script>
    <script src="_interface.js"></script>
    <script src="_postgame.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js')
        .catch(function(err) { console.warn('SW error:', err); });
    }
    </script>

    <script src="_online.js"></script>
</html>
