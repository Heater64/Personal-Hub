<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <script>
    // Aplica paleta y modo antes de renderizar (sin flash de color).
    // Debe coincidir con theme.service.js.
    (function() {
      var PALETAS = ['coral', 'frambuesa', 'azul'];
      var paleta = localStorage.getItem('ph.paleta');
      var modo = localStorage.getItem('ph.modo');
      var legacy = localStorage.getItem('ph.theme');

      if (PALETAS.indexOf(paleta) === -1) paleta = null;
      if (['auto', 'dark', 'light'].indexOf(modo) === -1) modo = null;

      if (!paleta && legacy) {
        if (legacy === 'azul-oscuro' || legacy === 'azul-claro') paleta = 'azul';
        else if (legacy === 'umbra-claro') paleta = 'frambuesa';
        else paleta = 'coral';
      }
      if (!modo && legacy) {
        if (legacy === 'auto') modo = 'auto';
        else modo = /-oscuro$/.test(legacy) ? 'dark' : (/^umbra-claro$/.test(legacy) || /-claro$/.test(legacy) ? 'light' : 'dark');
      }
      if (!paleta) paleta = 'coral';
      if (!modo) modo = 'auto';

      var resolved = modo === 'auto'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : modo;

      var el = document.documentElement;
      el.dataset.paleta = paleta;
      el.dataset.theme = resolved;
      el.style.colorScheme = resolved;
      if (paleta === 'azul') el.dataset.tema = 'azul';
      else delete el.dataset.tema;

      // Sincroniza la meta theme-color: la statusbar coincide desde el primer frame.
      var metas = {
        coral:     { dark: '#0a0a0c', light: '#f7f2ee' },
        frambuesa: { dark: '#140a10', light: '#f8edf0' },
        azul:      { dark: '#0b1220', light: '#f8fafc' }
      };
      var meta = document.head.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', metas[paleta][resolved]);
    })();
  </script>
  <!-- ============================================================
       Boot splash: pantalla de marca que se muestra al instante
       (mientras carga JS/CSS) y se desvanece cuando la app monta la
       primera vista (AppShell → router.afterEach). Sin JS, se oculta
       con la clase .no-js en <html>.
       ============================================================ -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--surface-0, #0a0a0c);
      color: var(--text-primary, #e8e6e3);
      transition: opacity .45s ease, visibility .45s ease;
    }
    .boot-splash__logo {
      width: 84px;
      height: 84px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      background: var(--accent, #e8735a);
      box-shadow: 0 10px 34px var(--accent-dim-strong, rgba(198, 90, 58, .35));
      animation: boot-pulse 1.6s ease-in-out infinite;
    }
    .boot-splash__name {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -.02em;
    }
    .boot-splash__tag {
      font-size: 12px;
      opacity: .55;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }
    .boot-splash__bar {
      width: 74px;
      height: 3px;
      border-radius: 99px;
      overflow: hidden;
      background: var(--divider-strong, rgba(255, 255, 255, .12));
    }
    .boot-splash__bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent, #e8735a);
      animation: boot-slide 1.1s ease-in-out infinite;
    }
    #boot-splash.boot-splash--hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    @keyframes boot-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes boot-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
