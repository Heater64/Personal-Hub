<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <script>
    // Apply theme before render to prevent flash
    (function() {
      var t = localStorage.getItem('ph.theme');
      if (t) {
        if (t === 'auto') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      }
      // Sincroniza la meta theme-color con el tema resuelto: la statusbar del
      // navegador/PWA coincide desde el primer frame (sin flash de color).
      var meta = document.head.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t === 'light' ? '#fdf4f6' : '#0c0b0b');
    })();
  </script>
  <!-- ============================================================
       Boot splash: pantalla de marca que se muestra al instante
       (mientras carga JS/CSS) y se desvanece cuando la app monta la
       primera vista (AppShell → router.afterEach). Sin JS, se oculta
       con la clase .no-js en <html>.
       ============================================================ -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #0c0b0b;
      color: #e8e6e3;
      transition: opacity .45s ease, visibility .45s ease;
    }
    html[data-theme="light"] #boot-splash { background: #fdf4f6; color: #3a2e32; }
    .boot-splash__logo {
      width: 84px;
      height: 84px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      background: linear-gradient(135deg, #c65a3a, #e8735a);
      box-shadow: 0 10px 34px rgba(198, 90, 58, .35);
      animation: boot-pulse 1.6s ease-in-out infinite;
    }
    .boot-splash__name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 22px;
      letter-spacing: .5px;
    }
    .boot-splash__tag {
      font-size: 12px;
      opacity: .55;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }
    .boot-splash__bar {
      width: 74px;
      height: 3px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(255, 255, 255, .12);
    }
    html[data-theme="light"] .boot-splash__bar { background: rgba(0, 0, 0, .1); }
    .boot-splash__bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: #e8735a;
      animation: boot-slide 1.1s ease-in-out infinite;
    }
    #boot-splash.boot-splash--hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    @keyframes boot-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes boot-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0c0b0b">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hub">
  <title>Personal Hub</title>
  <meta name="description" content="Tu rincón personal">
  <!-- DNS prefetch & preconnect for critical origins -->

  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://res.cloudinary.com">
  <link rel="dns-prefetch" href="https://dragonballlatino.net">
  <link rel="dns-prefetch" href="https://i.scdn.co">
  <link rel="dns-prefetch" href="https://images.genius.com">
  <link rel="dns-prefetch" href="https://i.ytimg.com">
  <link rel="dns-prefetch" href="https://cdn-images.dzcdn.net">
  <link rel="dns-prefetch" href="https://i1.sndcdn.com">
  <link rel="dns-prefetch" href="https://m.media-amazon.com">
  <link rel="dns-prefetch" href="https://akamai.sscdn.co">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://dragonballlatino.net" crossorigin>
  <link rel="preconnect" href="https://josxcvncescqqlajahkh.supabase.co" crossorigin>
  <!-- Critical font loading with display=swap for instant text rendering -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"></noscript>
  <!-- Critical CSS -->
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <div id="boot-splash" aria-hidden="true">
    <div class="boot-splash__logo">🧸</div>
    <div class="boot-splash__name">Personal Hub</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
