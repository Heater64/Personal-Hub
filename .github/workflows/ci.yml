name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancela la ejecución anterior si llega una commit nueva a la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build-audit:
    name: Tests, build y auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Valores de mentira: los builds solo necesitan que existan para no
    # emitir "undefined" en el bundle. Las reales viven en Vercel.
    # Van a nivel de job para que lleguen a los dos builds (personal-hub y
    # Tamp); un `env` de un step sin `run` no se aplicaba a nada.
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
      VITE_CLOUDINARY_CLOUD_NAME: placeholder
      VITE_CLOUDINARY_UPLOAD_PRESET: placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 ya no sirve: @supabase/realtime-js exige WebSocket nativo
          # (Node 22+) y los tests de métricas crean un cliente de verdad.
          # Es también el runtime con el que Vercel construye el sitio.
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests de contrato
        run: npm test

      - name: Build
        run: npm run build

      # Es lo que Vercel publica: vercel.json compila `npm run build:tamp`
      # y sirve `tamp/dist`. Si esto rompe, el deploy rompe.
      - name: Build de Tamp
        run: npm run build:tamp

      # El informe de auditoría bloqueaba el lanzamiento por nanoid < 3.3.18.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Comprobar que los builds no arrastran secretos
        run: |
          for dir in personal-hub/dist tamp/dist; do
            if grep -rIl --exclude-dir=assets --exclude-dir=games \
                 -E 'eyJ[A-Za-z0-9_-]{20,}\.|service_role' "$dir"; then
              echo "::error::El bundle ($dir) contiene algo con pinta de clave de Supabase"
              exit 1
            fi
          done
          echo "Sin claves en los bundles."
