name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancela la ejecución anterior si llega una commit nueva a la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build-audit:
    name: Tests, build y auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Valores de mentira: los builds solo necesitan que existan para no
    # emitir "undefined" en el bundle. Las reales viven en Vercel.
    # Valores compartidos por el único build de Tamp.
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
      VITE_CLOUDINARY_CLOUD_NAME: placeholder
      VITE_CLOUDINARY_UPLOAD_PRESET: placeholder

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # Node 20 ya no sirve: @supabase/realtime-js exige WebSocket nativo
          # (Node 22+) y los tests de métricas crean un cliente de verdad.
          # Es también el runtime con el que Vercel construye el sitio.
          node-version: 24
          cache: npm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Tests de contrato
        run: npm test

      - name: Build
        run: npm run build

      - name: Preparar aplicación Android
        run: npx cap sync android

      - name: Tests nativos y APK debug
        working-directory: android
        run: ./gradlew testDebugUnitTest lint assembleDebug

      # El informe de auditoría bloqueaba el lanzamiento por nanoid < 3.3.18.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=low

      - name: Verificar firmas de dependencias
        run: npm audit signatures

      - name: Comprobar que los builds no arrastran secretos
        run: node scripts/check-build-secrets.js
