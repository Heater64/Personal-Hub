<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="sentGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(64 80) scale(50)">
      <stop offset="0" stop-color="#ff7f8d" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#ff7f8d" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff7f8d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sentGlass" x1="42" y1="44" x2="92" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe6da" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#f8b3aa" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ef8b98" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="sentCork" x1="46" y1="20" x2="82" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9d1a4"/>
      <stop offset="1" stop-color="#d98e63"/>
    </linearGradient>
    <linearGradient id="sentHeart" x1="44" y1="58" x2="86" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb0a2"/>
      <stop offset=".45" stop-color="#ff7b85"/>
      <stop offset="1" stop-color="#e0526c"/>
    </linearGradient>
    <linearGradient id="sentTag" x1="88" y1="56" x2="112" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0e6"/>
      <stop offset="1" stop-color="#f7c3b4"/>
    </linearGradient>
  </defs>

  <ellipse cx="64" cy="80" rx="50" ry="46" fill="url(#sentGlow)"/>

  <!-- corcho -->
  <rect x="47" y="20" width="34" height="14" rx="7" fill="url(#sentCork)"/>
  <ellipse cx="64" cy="20" rx="17" ry="6" fill="#ffdcb8"/>
  <path d="M47 30c7 3 27 3 34 0" stroke="#c97f57" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="55" cy="22" rx="6" ry="2.2" fill="#fff3e4" fill-opacity=".7"/>

  <!-- cuello -->
  <path d="M50 33h28v13a4 4 0 0 1-4 4H54a4 4 0 0 1-4-4z" fill="url(#sentGlass)"/>
  <!-- boca -->
  <ellipse cx="64" cy="42.5" rx="19" ry="6" fill="#ffe8dc" fill-opacity=".92"/>
  <ellipse cx="64" cy="42.5" rx="19" ry="6" stroke="#ffb6a6" stroke-width="1.6"/>

  <!-- cuerpo del frasco -->
  <path d="M41 50c0-5 4-9 9-9h28c5 0 9 4 9 9v46c0 8-6 14-14 14H55c-8 0-14-6-14-14z" fill="url(#sentGlass)" stroke="#ffc4b2" stroke-width="1.8"/>
  <!-- luz interior -->
  <ellipse cx="64" cy="98" rx="24" ry="12" fill="#ff8b93" fill-opacity=".45"/>
  <ellipse cx="64" cy="78" rx="27" ry="27" fill="#ff9aa0" fill-opacity=".28"/>

  <!-- corazón -->
  <path d="M64 98c0 0-23-15.5-23-29 0-8.6 6.6-15.4 14.8-15.4 4.1 0 6.9 1.9 8.2 4.2 1.3-2.3 4.1-4.2 8.2-4.2C80.4 53.6 87 60.4 87 69c0 13.5-23 29-23 29z" fill="url(#sentHeart)"/>
  <path d="M56 60.6c-2.6 1-4.4 3.6-4.4 7 0 2.6 1.4 5.4 3.2 8" stroke="#fff" stroke-opacity=".55" stroke-width="3.4" stroke-linecap="round"/>

  <!-- base de cristal -->
  <path d="M49 105c4 3.4 9 5 15 5s11-1.6 15-5" stroke="#fff" stroke-opacity=".45" stroke-width="2.4" stroke-linecap="round"/>

  <!-- reflejos -->
  <path d="M47.6 55.5c-2.6 5-3.6 11.6-3.4 18" stroke="#fff" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/>
  <path d="M80.6 55.5c1.8 3.4 2.6 7.4 2.6 11.4" stroke="#fff" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>

  <!-- etiqueta -->
  <path d="M81 41.5c5.4 1.8 8 5.4 7.2 9.6" stroke="#ffcdb8" stroke-width="2.4" stroke-linecap="round"/>
  <g transform="rotate(15 97 68)">
    <rect x="85" y="55" width="24" height="30" rx="7" fill="url(#sentTag)"/>
    <circle cx="97" cy="61.5" r="2.6" fill="#e69a8d"/>
    <path d="M97 78.6c0 0-6.2-4.2-6.2-7.8 0-2.4 1.8-4.3 4-4.3 1.1 0 1.9.5 2.2 1.2.3-.7 1.1-1.2 2.2-1.2 2.2 0 4 1.9 4 4.3 0 3.6-6.2 7.8-6.2 7.8z" fill="#e2606f"/>
  </g>

  <!-- destellos -->
  <path d="M30 40.5l1.6 4.4 4.4 1.6-4.4 1.6-1.6 4.4-1.6-4.4-4.4-1.6 4.4-1.6z" fill="#ffd7c0"/>
  <path d="M96 34l1.1 3 3 1.1-3 1.1-1.1 3-1.1-3-3-1.1 3-1.1z" fill="#ffc7b4" fill-opacity=".9"/>
  <circle cx="36" cy="86" r="2.2" fill="#ffb9a8" fill-opacity=".8"/>
  <circle cx="44" cy="94" r="1.5" fill="#ffd9c8" fill-opacity=".9"/>
</svg>
