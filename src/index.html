<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <base href="/src/">
    <script>(function(){
        var t = localStorage.getItem('personalHub.theme');
        if (t) {
            if (t === 'auto') {
                t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light-pink' : 'dark';
            }
            document.documentElement.setAttribute('data-theme', t);
        }
    })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hub">
    <title>Personal Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/home.css">
    <link rel="stylesheet" href="../css/pages/sentimientos.css">
    <link rel="stylesheet" href="../css/pages/razones.css">
    <link rel="stylesheet" href="../css/pages/canciones.css">
    <link rel="stylesheet" href="../css/pages/openwhen.css">
    <link rel="stylesheet" href="../css/pages/maldia.css">
    <link rel="stylesheet" href="../css/pages/series.css">
    <link rel="stylesheet" href="../css/pages/thoseeyes.css">
    <link rel="stylesheet" href="../css/pages/juegos.css">
    <link rel="stylesheet" href="../css/pages/calendario.css">
    <link rel="stylesheet" href="../css/pages/rincon.css">
    <link rel="stylesheet" href="../css/components/bottom-nav.css">
    <link rel="stylesheet" href="../css/components/toast.css">
    <link rel="stylesheet" href="../css/components/sidebar.css">
    <link rel="stylesheet" href="../css/components/sub-nav.css">
    <link rel="stylesheet" href="../css/components/modal.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/cards.css">
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dcsent4fs/image/upload/v1783958827/imagen_192x192_cqgclt.png">
    <meta name="theme-color" content="#0c0b0b">
    <style>
        /* App shell */
        .app-shell { min-height: 100vh; padding-bottom: 80px; }
        #view { max-width: 1400px; margin: 0 auto; padding: 16px 20px; }
        #view .page { width: 100%; }
        #view .page-section { max-width: 1200px; margin: 0 auto; width: 100%; }
        .page-error { text-align: center; padding: 80px 20px; color: var(--umbra-ash); }
        .page-error h2 { font-size: 3rem; font-family: 'Playfair Display', serif; color: var(--accent-coral); margin-bottom: 8px; }
        .page-placeholder { text-align: center; padding: 60px 20px; color: var(--umbra-ash); }

        /* Light theme overrides */
        html[data-theme="light-pink"] #view,
        html[data-theme="light-pink"] .app-shell {
            background: var(--bg, #fff0f5);
        }

        /* Hide sidebar-toggle in SPA since we use bottom-nav */
        .sidebar-toggle { display: none !important; }

        /* Toast position */
        .toast-message {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
        }

        @media (max-width: 640px) {
            #view { padding: 12px 14px; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <main class="page-content" id="view">
            <div class="page-placeholder">
                <div style="font-size: 1.5rem; animation: pulse 1.5s ease infinite;">Cargando...</div>
            </div>
        </main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav" role="navigation" aria-label="Navegación principal">
        <button class="bottom-nav-btn" data-page="home" onclick="window.location.hash='home'" aria-label="Inicio">
            <i data-lucide="home"></i>
            <span>Inicio</span>
        </button>
        <button class="bottom-nav-btn" data-page="rincon" onclick="window.location.hash='rincon'" aria-label="Rincón">
            <i data-lucide="compass"></i>
            <span>Rincón</span>
        </button>
        <button class="bottom-nav-btn" data-page="sentimientos" onclick="window.location.hash='sentimientos'" aria-label="Sentimientos">
            <i data-lucide="heart"></i>
            <span>Sentimientos</span>
        </button>
        <button class="bottom-nav-btn" data-page="juegos" onclick="window.location.hash='juegos'" aria-label="Juegos">
            <i data-lucide="gamepad-2"></i>
            <span>Juegos</span>
        </button>
        <button class="bottom-nav-btn" data-page="canciones" onclick="window.location.hash='canciones'" aria-label="Canciones">
            <i data-lucide="music"></i>
            <span>Canciones</span>
        </button>
    </nav>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="core/router.js"></script>
    <script src="core/utils.js"></script>
    <script src="services/news.service.js"></script>
    <script src="pages/Home.js"></script>
    <script src="pages/Rincon.js"></script>
    <script src="pages/Sentimientos.js"></script>
    <script src="pages/Razones.js"></script>
    <script src="pages/Canciones.js"></script>
    <script src="pages/OpenWhen.js"></script>
    <script src="pages/MalDia.js"></script>
    <script src="pages/Series.js"></script>
    <script src="pages/ThoseEyes.js"></script>
    <script src="pages/Juegos.js"></script>
    <script src="pages/Calendario.js"></script>
    <script>
        // Boot app
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
                // Re-create icons on navigation
                const observer = new MutationObserver(() => {
                    lucide.createIcons();
                });
                observer.observe(document.getElementById('view'), { childList: true, subtree: true });
            }
        });
    </script>
</body>
</html>
